<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4BC"/>
      <stop offset="50%" stop-color="#E8D49A"/>
      <stop offset="100%" stop-color="#D4B97A"/>
    </linearGradient>
    <pattern id="aging" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="2" fill="#8B6F2A" opacity="0.15"/>
      <circle cx="70" cy="60" r="1.5" fill="#8B6F2A" opacity="0.15"/>
      <circle cx="40" cy="80" r="1" fill="#8B6F2A" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="500" height="400" fill="url(#parchment)"/>
  <rect width="500" height="400" fill="url(#aging)"/>
  <!-- Decorative border -->
  <rect x="20" y="20" width="460" height="360" fill="none" stroke="#8B6F2A" stroke-width="3"/>
  <rect x="30" y="30" width="440" height="340" fill="none" stroke="#8B6F2A" stroke-width="1"/>
  <!-- Calligraphy lines (Arabic script style abstracted) -->
  <g stroke="#3D1F0A" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 60 90 Q 100 80 140 90 T 220 95 T 300 88 T 380 92 T 440 90"/>
    <path d="M 60 130 Q 90 120 130 128 T 200 125 T 280 130 T 360 125 T 440 130"/>
    <path d="M 60 170 Q 110 160 160 168 T 240 165 T 320 170 T 440 168"/>
    <path d="M 60 210 Q 100 200 140 208 T 220 205 T 300 210 T 380 205 T 440 210"/>
    <path d="M 60 250 Q 90 240 130 248 T 200 245 T 280 250 T 360 245 T 440 250"/>
    <path d="M 60 290 Q 110 280 160 288 T 240 285 T 320 290 T 400 285"/>
  </g>
  <!-- Diacritics -->
  <g fill="#3D1F0A">
    <circle cx="100" cy="80" r="2"/>
    <circle cx="180" cy="85" r="2"/>
    <circle cx="260" cy="82" r="2"/>
    <circle cx="340" cy="85" r="2"/>
    <circle cx="120" cy="120" r="2"/>
    <circle cx="220" cy="118" r="2"/>
    <circle cx="300" cy="120" r="2"/>
    <circle cx="160" cy="160" r="2"/>
    <circle cx="280" cy="158" r="2"/>
  </g>
  <!-- Geometric ornament corner -->
  <g transform="translate(380, 320)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#A0521C" stroke-width="2"/>
    <path d="M -15 0 L 0 -15 L 15 0 L 0 15 Z" fill="#A0521C" opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="#A0521C"/>
  </g>
  <!-- Label -->
  <rect x="80" y="350" width="220" height="32" rx="4" fill="#3D1F0A"/>
  <text x="190" y="372" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="#F4E4BC">MANUSCRIT DE TOMBOUCTOU</text>
</svg>
