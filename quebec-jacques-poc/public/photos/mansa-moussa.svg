<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B6F2A"/>
      <stop offset="100%" stop-color="#5A4317"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="url(#halo)"/>
  <!-- Crown -->
  <path d="M 130 130 L 145 100 L 165 125 L 185 90 L 200 120 L 215 90 L 235 125 L 255 100 L 270 130 L 270 145 L 130 145 Z" fill="#FFD700" stroke="#8B6F2A" stroke-width="2"/>
  <circle cx="200" cy="115" r="6" fill="#CE1126"/>
  <!-- Face oval -->
  <ellipse cx="200" cy="210" rx="65" ry="80" fill="#3D2817"/>
  <!-- Eyes -->
  <ellipse cx="180" cy="200" rx="6" ry="4" fill="#FFFFFF"/>
  <ellipse cx="220" cy="200" rx="6" ry="4" fill="#FFFFFF"/>
  <circle cx="180" cy="200" r="3" fill="#000"/>
  <circle cx="220" cy="200" r="3" fill="#000"/>
  <!-- Mustache + beard -->
  <path d="M 175 230 Q 200 240 225 230" stroke="#1a0f00" stroke-width="3" fill="none"/>
  <path d="M 165 250 Q 200 280 235 250 Q 235 275 200 285 Q 165 275 165 250 Z" fill="#1a0f00"/>
  <!-- Robe -->
  <path d="M 130 290 Q 200 270 270 290 L 280 480 L 120 480 Z" fill="#0a3d62"/>
  <!-- Gold necklace with coin -->
  <ellipse cx="200" cy="320" rx="35" ry="8" fill="none" stroke="#FFD700" stroke-width="3"/>
  <circle cx="200" cy="340" r="18" fill="#FFD700"/>
  <text x="200" y="346" text-anchor="middle" font-family="serif" font-weight="900" font-size="20" fill="#8B6F2A">$</text>
  <!-- Label -->
  <rect x="50" y="430" width="300" height="40" rx="6" fill="#FFFFFF" opacity="0.92"/>
  <text x="200" y="458" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#3D2817">MANSA MOUSSA · 1280-1337</text>
</svg>
