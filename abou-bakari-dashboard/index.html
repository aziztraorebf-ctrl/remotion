<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abou Bakari II — Production Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header>
  <h1>Abou Bakari II — Production Dashboard</h1>
  <div class="meta" id="meta-info">Chargement...</div>
</header>

<section class="summary">
  <div class="summary-card">
    <span class="summary-label">Durée totale</span>
    <span class="summary-value" id="total-duration">—</span>
  </div>
  <div class="summary-card">
    <span class="summary-label">Scènes</span>
    <span class="summary-value"><span id="scenes-done">0</span> / <span id="scenes-total">0</span></span>
  </div>
  <div class="summary-card">
    <span class="summary-label">Budget restant</span>
    <span class="summary-value" id="budget-remaining">—</span>
  </div>
  <div class="progress">
    <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
  </div>
</section>

<section class="rules-summary">
  <h2>Règles actives</h2>
  <ul id="rules-list"></ul>
</section>

<main id="scenes-container"></main>

<footer>
  <p>Dashboard v1.0 — Abou Bakari II Production — 2026-04-25</p>
</footer>

<!-- Scene card template -->
<template id="scene-template">
  <article class="scene" data-scene-id="">
    <div class="scene-header">
      <div class="scene-id"></div>
      <div class="scene-status-badge"></div>
    </div>
    <h2 class="scene-title"></h2>
    <div class="scene-meta">
      <span class="scene-timing"></span>
      <span class="scene-type"></span>
    </div>
    <p class="scene-narration"></p>

    <details class="scene-section">
      <summary>Description visuelle</summary>
      <p class="scene-description"></p>
    </details>

    <details class="scene-section">
      <summary>Prompt Gemini (image source)</summary>
      <pre class="scene-prompt-gemini"></pre>
    </details>

    <details class="scene-section">
      <summary>Prompt Seedance (animation clip)</summary>
      <pre class="scene-prompt-seedance"></pre>
    </details>

    <details class="scene-section">
      <summary>Options caméra (SAFE/MEDIUM/RISKY)</summary>
      <ul class="scene-camera-options"></ul>
    </details>

    <details class="scene-section">
      <summary>Mouvements intrinsèques R-DYNAMIC</summary>
      <ul class="scene-intrinsic-motions"></ul>
    </details>

    <div class="scene-assets">
      <div class="asset-slot" data-asset="image">
        <span class="asset-label">Image source</span>
        <span class="asset-status"></span>
      </div>
      <div class="asset-slot" data-asset="clip">
        <span class="asset-label">Clip final</span>
        <span class="asset-status"></span>
      </div>
    </div>

    <div class="scene-footer">
      <span class="scene-cost">Coût estimé: <strong class="scene-cost-est"></strong></span>
      <span class="scene-cost-actual" style="display:none">Coût réel: <strong class="scene-cost-value"></strong></span>
    </div>

    <details class="scene-section scene-notes">
      <summary>Notes</summary>
      <p class="scene-notes-text"></p>
    </details>

    <details class="scene-section scene-history" style="display:none">
      <summary>Historique versions</summary>
      <ul class="scene-history-list"></ul>
    </details>
  </article>
</template>

<script src="dashboard.js"></script>
</body>
</html>
