<?xml version="1.0" encoding="UTF-8"?>
<!--
  LE VERROU CROISE : conduite de gaz en coupe, deux vannes, paradoxe Maroc/Algerie (17,3 s).
  SVG statique 1920x1080. Aucune animation ici : chaque piece animable est un <g id> independant.
  Etat livre = temps 1 (cas MAROC) visible ; les etats temps 2 sont superposes en opacity="0".

  GROUPES (ordre de dessin = ordre z) :
    fond                  decor radial fixe. Ne pas animer.
    ambiance_or           halo ambiant dore (temps 1). Crossfade opacity 1>0 vers 7,8 s.
    ambiance_cyan         halo ambiant cyan (temps 2). opacity 0>1 a 7,8 s.
    conduite_interieur    volume creux de la conduite, zone sombre au-dela de la vanne 2.
                          Fixe. Le clipPath id="clip_interieur" (defs) reprend sa geometrie
                          et clippe deja le wrapper zone_fluides.
    zone_fluides          wrapper clippe par clip_interieur. Ne pas animer lui-meme.
    fluide_cyan           fluide cyan PLEIN sur toute la longueur utile (x=60 a x=1266).
                          opacity 0. Temps 2 : opacity 1 puis reveler de gauche a droite
                          par clip/mask anime (7,8 s -> 13 s), le front bute sur l'opercule.
    fluide_or             fluide dore PLEIN (x=60 a x=1266). Temps 1 : reveler de gauche a
                          droite par clip/mask anime (0 -> 4,5 s), front bute sur l'opercule
                          a 1266 ; micro-oscillation x de +-6 px ensuite (il pousse, ne passe
                          pas). Fade out opacity 1>0 entre 7,0 et 7,8 s.
    conduite_corps        parois, brides, chants de coupe. Fixe.
    vanne1_corps          corps de la vanne 1 (x=640), passage OUVERT. Fixe.
    vanne1_volant         volant seul, origine locale (0,0) = axe de rotation, place par
                          translate(640 258). Animer par rotate() seul : temps 1, rotation
                          lente continue (~35 deg/s) pendant que le fluide avance ; stop net
                          quand le front bute (4,5 s).
    disques_verrouilles   etat temps 2 de la vanne 1 (financement acquis, Algerie) :
                          disques cyan verrouilles sur la tige. opacity 0 ; reveal 7,8 -> 9 s
                          (opacity + petit scale 0.9>1 depuis son origine translate(640 390)).
    vanne2_corps          corps de la vanne 2 (x=1280), fin. Fixe.
    vanne2_opercule       lame qui FERME le passage. Fixe (fermee dans les deux temps).
                          Option : tremblement y de 2 px quand le fluide pousse.
    vanne2_mecanisme_fin  filaments arachneens dores (etat temps 1, financement bloque,
                          Maroc). Visible au depart ; fade out 7,0 -> 7,8 s. Option reveal
                          initial par stroke-dashoffset.
    vanne2_volant         volant fin seul, origine (0,0) = axe, place par translate(1280 252).
                          Temps 1 : petites tentatives de rotation avortees (+-8 deg, spring)
                          quand le fluide bute. Ne tourne jamais en continu.
    barbeles              barbeles autour de la vanne 2 (temps 2). opacity 0 ; reveler
                          10 -> 12 s (opacity, ou stroke-dashoffset fil par fil).
    fissures_rouges       fissures rouges + halo (temps 2). opacity 0 ; reveler 12 -> 14 s
                          (opacity par saccades, avec le SFX craquement).
    plaque_maroc          plaque nom MAROC, origine translate(960 122). Visible temps 1 ;
                          fade out a 7,8 s.
    plaque_algerie        plaque nom ALGERIE, meme position. opacity 0 ; fade in a 7,8 s.

  Regles respectees : aucun style inline, presentation en attributs XML ; pas de <style>,
  pas de classes, pas de <animate>, pas de script ; degrades a 3 arrets max ; palette stricte.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="gradFond" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#050c1a"/>
    </radialGradient>
    <linearGradient id="gradInterieur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#050c1a"/>
    </linearGradient>
    <linearGradient id="gradVide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050c1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050c1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gradOr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE38A"/>
      <stop offset="45%" stop-color="#FFC742"/>
      <stop offset="100%" stop-color="#FFC742"/>
    </linearGradient>
    <radialGradient id="gradHaloOr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC742" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFC742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradHaloCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C4FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00C4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradHaloRouge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4B45" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF4B45" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip_interieur">
      <rect x="60" y="482" width="1800" height="116"/>
    </clipPath>
  </defs>

  <g id="fond">
    <rect x="0" y="0" width="1920" height="1080" fill="url(#gradFond)"/>
  </g>

