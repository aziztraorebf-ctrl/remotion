<g id="pictogram-aeroport-topdown">
  <!-- ================= PISTE PRINCIPALE ================= -->
  <!-- bande d'accotement (plus claire, légèrement plus large que la piste) -->
  <rect x="-38" y="-4.2" width="76" height="8.4" fill="#948566" stroke="#2b2117" stroke-width="0.35"/>
  <!-- piste (revêtement plus sombre) -->
  <rect x="-37" y="-3" width="74" height="6" fill="#8a7c5e" stroke="#2b2117" stroke-width="0.4"/>
  <!-- axe pointillé -->
  <line x1="-34" y1="0" x2="34" y2="0" stroke="#2b2117" stroke-width="0.35" stroke-dasharray="2.2,1.8"/>
  <!-- marquages de seuil (bandes transversales) aux deux extrémités -->
  <g stroke="#2b2117" stroke-width="0.5">
    <line x1="-35.5" y1="-2.2" x2="-35.5" y2="2.2"/>
    <line x1="-33.7" y1="-2.2" x2="-33.7" y2="2.2"/>
    <line x1="-31.9" y1="-2.2" x2="-31.9" y2="2.2"/>
    <line x1="35.5" y1="-2.2" x2="35.5" y2="2.2"/>
    <line x1="33.7" y1="-2.2" x2="33.7" y2="2.2"/>
    <line x1="31.9" y1="-2.2" x2="31.9" y2="2.2"/>
  </g>

  <!-- ================= TAXIWAYS (voies de circulation, plus étroites) ================= -->
  <!-- taxiway reliant piste -> tarmac (diagonale courte) -->
  <path d="M -6,3 L -3,9 L -3,13 L -12,17 L -12,13.5 L -6.5,10.5 Z" fill="#8a7c5e" stroke="#2b2117" stroke-width="0.35"/>
  <!-- taxiway parallèle secondaire reliant l'autre extrémité au tarmac -->
  <path d="M 10,3 L 8,7.5 L 8,10 L -1,10 L -1,7 L 6.5,7 Z" fill="#8a7c5e" stroke="#2b2117" stroke-width="0.35"/>

  <!-- ================= TARMAC / AIRE DE STATIONNEMENT ================= -->
  <polygon points="-30,14 22,14 27,29 -22,32" fill="#877a5c" stroke="#2b2117" stroke-width="0.45"/>
  <!-- lignes de guidage sur le tarmac -->
  <g stroke="#2b2117" stroke-width="0.25" opacity="0.6">
    <line x1="-20" y1="16" x2="-14" y2="29.5"/>
    <line x1="-6" y1="15.3" x2="-3" y2="30.5"/>
    <line x1="8" y1="14.6" x2="14" y2="30"/>
  </g>

  <!-- ================= TERMINAL (bâtiment principal) ================= -->
  <rect x="-19" y="19" width="34" height="7.5" fill="#7a6d53" stroke="#2b2117" stroke-width="0.45"/>
  <!-- jetées d'embarquement (épis) -->
  <rect x="-9" y="26.5" width="3.4" height="7" fill="#7a6d53" stroke="#2b2117" stroke-width="0.35"/>
  <rect x="0" y="26.5" width="3.4" height="7.5" fill="#7a6d53" stroke="#2b2117" stroke-width="0.35"/>
  <rect x="9" y="26.5" width="3.4" height="6.5" fill="#7a6d53" stroke="#2b2117" stroke-width="0.35"/>
  <!-- toit : légère trame de structure (fenêtres/verrière) -->
  <line x1="-19" y1="22.7" x2="15" y2="22.7" stroke="#2b2117" stroke-width="0.2" opacity="0.5"/>

  <!-- ================= AVIONS GARÉS SUR LE TARMAC (en épi) ================= -->
  <!-- silhouette avion top-down : fuselage + ailes + empennage -->
  <g id="def-avion-gare">
    <!-- avion 1 -->
    <g transform="translate(-14,17) rotate(35) scale(0.62)">
      <path d="M0,-9 L1.1,-3 L7,1.5 L7,3 L1.2,1.3 L1.6,7.5 L4,9.5 L4,10.6 L0,9.3 L-4,10.6 L-4,9.5 L-1.6,7.5 L-1.2,1.3 L-7,3 L-7,1.5 L-1.1,-3 Z"
            fill="#7f7358" stroke="#2b2117" stroke-width="0.55"/>
    </g>
    <!-- avion 2 -->
    <g transform="translate(-2,17.5) rotate(35) scale(0.62)">
      <path d="M0,-9 L1.1,-3 L7,1.5 L7,3 L1.2,1.3 L1.6,7.5 L4,9.5 L4,10.6 L0,9.3 L-4,10.6 L-4,9.5 L-1.6,7.5 L-1.2,1.3 L-7,3 L-7,1.5 L-1.1,-3 Z"
            fill="#7f7358" stroke="#2b2117" stroke-width="0.55"/>
    </g>
    <!-- avion 3 -->
    <g transform="translate(10,17) rotate(35) scale(0.62)">
      <path d="M0,-9 L1.1,-3 L7,1.5 L7,3 L1.2,1.3 L1.6,7.5 L4,9.5 L4,10.6 L0,9.3 L-4,10.6 L-4,9.5 L-1.6,7.5 L-1.2,1.3 L-7,3 L-7,1.5 L-1.1,-3 Z"
            fill="#7f7358" stroke="#2b2117" stroke-width="0.55"/>
    </g>
  </g>

  <!-- ================= AVION SUR LA PISTE (en approche / au sol) ================= -->
  <g transform="translate(-16,0.3) rotate(90) scale(1.05)">
    <path d="M0,-9 L1.1,-3 L7,1.5 L7,3 L1.2,1.3 L1.6,7.5 L4,9.5 L4,10.6 L0,9.3 L-4,10.6 L-4,9.5 L-1.6,7.5 L-1.2,1.3 L-7,3 L-7,1.5 L-1.1,-3 Z"
          fill="#948566" stroke="#2b2117" stroke-width="0.6"/>
  </g>
</g>
