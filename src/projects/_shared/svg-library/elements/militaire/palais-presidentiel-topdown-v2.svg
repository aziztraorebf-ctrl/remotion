<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80" width="400" height="400">
<rect x="-40" y="-40" width="80" height="80" fill="#d1b27c"/>
<g stroke="#2b2117" stroke-width="0.6" stroke-linejoin="round">

  <!-- Mur d'enceinte du domaine : rectangle net englobant -->
  <rect x="-37" y="-36" width="74" height="72" fill="none" stroke-width="1" />

  <!-- Jardins a la francaise arriere : grille de parterres carres, en axe -->
  <g stroke-width="0.35">
    <rect x="-30" y="10" width="8" height="8" fill="#c7a76f"/>
    <rect x="-20" y="10" width="8" height="8" fill="#c7a76f"/>
    <rect x="2" y="10" width="8" height="8" fill="#c7a76f"/>
    <rect x="12" y="10" width="8" height="8" fill="#c7a76f"/>
    <rect x="-30" y="20" width="8" height="8" fill="#c7a76f"/>
    <rect x="-20" y="20" width="8" height="8" fill="#c7a76f"/>
    <rect x="2" y="20" width="8" height="8" fill="#c7a76f"/>
    <rect x="12" y="20" width="8" height="8" fill="#c7a76f"/>
    <line x1="-9" y1="8" x2="-9" y2="30" stroke-width="0.5"/>
  </g>
  <!-- bassin rectangulaire arriere, en axe central -->
  <rect x="-6" y="14" width="12" height="20" fill="#8f8266" />
  <line x1="0" y1="14" x2="0" y2="34" stroke-width="0.3"/>
  <line x1="-6" y1="24" x2="6" y2="24" stroke-width="0.3"/>

  <!-- Corps de batiment principal en U : avant-corps + deux ailes en retour -->
  <g fill="#8f8266">
    <!-- aile gauche -->
    <rect x="-24" y="-4" width="10" height="16" />
    <!-- aile droite -->
    <rect x="14" y="-4" width="10" height="16" />
    <!-- corps central / avant-corps -->
    <rect x="-14" y="-4" width="28" height="10" />
  </g>
  <!-- toitures : faitages symetriques (lignes de crete) -->
  <g stroke-width="0.3">
    <line x1="-19" y1="-4" x2="-19" y2="12" />
    <line x1="19" y1="-4" x2="19" y2="12" />
    <line x1="-14" y1="1" x2="14" y2="1" />
  </g>
  <!-- refends de facade (rythme colonnes/travees) -->
  <g stroke-width="0.25">
    <line x1="-10" y1="-4" x2="-10" y2="6" />
    <line x1="-5" y1="-4" x2="-5" y2="6" />
    <line x1="5" y1="-4" x2="5" y2="6" />
    <line x1="10" y1="-4" x2="10" y2="6" />
    <line x1="-21" y1="-4" x2="-21" y2="12" />
    <line x1="21" y1="-4" x2="21" y2="12" />
  </g>

  <!-- Rotonde / dome central en portique, accroche au corps principal -->
  <circle cx="0" cy="-6" r="6.5" fill="#9a8d73" />
  <circle cx="0" cy="-6" r="6.5" fill="none" stroke-width="0.5"/>
  <circle cx="0" cy="-6" r="3.6" fill="#8f8266" />
  <!-- colonnade du portique : points radiaux -->
  <g fill="#2b2117">
    <circle cx="0" cy="-12.3" r="0.55"/>
    <circle cx="3.2" cy="-11.4" r="0.55"/>
    <circle cx="-3.2" cy="-11.4" r="0.55"/>
    <circle cx="5.6" cy="-9.1" r="0.55"/>
    <circle cx="-5.6" cy="-9.1" r="0.55"/>
    <circle cx="6.4" cy="-6" r="0.55"/>
    <circle cx="-6.4" cy="-6" r="0.55"/>
  </g>
  <circle cx="0" cy="-6" r="1" fill="#2b2117"/>

  <!-- Cour d'honneur : espace gravillonne devant le corps principal -->
  <path d="M -24 6 L -24 22 L 24 22 L 24 6 Z" fill="#c7a76f" stroke-width="0.4"/>

  <!-- Rond-point / bassin circulaire au centre de la cour -->
  <circle cx="0" cy="16" r="4.2" fill="#8f8266" stroke-width="0.4"/>
  <circle cx="0" cy="16" r="1.6" fill="none" stroke-width="0.3"/>
  <line x1="0" y1="11.8" x2="0" y2="20.2" stroke-width="0.25"/>
  <line x1="-4.2" y1="16" x2="4.2" y2="16" stroke-width="0.25"/>

  <!-- Allee d'honneur axiale reliant grille -> rond-point -> perron -->
  <line x1="0" y1="20.2" x2="0" y2="30" stroke-width="0.4"/>

  <!-- Grille d'entree monumentale + deux pavillons de garde symetriques -->
  <line x1="-24" y1="30" x2="24" y2="30" stroke-width="1"/>
  <g stroke-width="0.3">
    <line x1="-20" y1="28" x2="-20" y2="30"/>
    <line x1="-14" y1="28" x2="-14" y2="30"/>
    <line x1="-8" y1="28" x2="-8" y2="30"/>
    <line x1="8" y1="28" x2="8" y2="30"/>
    <line x1="14" y1="28" x2="14" y2="30"/>
    <line x1="20" y1="28" x2="20" y2="30"/>
  </g>
  <rect x="-27" y="27" width="5" height="5" fill="#9a8d73"/>
  <rect x="22" y="27" width="5" height="5" fill="#9a8d73"/>
  <!-- piliers d'entree renforces en axe -->
  <rect x="-2" y="28.5" width="4" height="3" fill="#7a6d53"/>

</g>
</svg>
