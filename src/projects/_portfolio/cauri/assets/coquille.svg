<!-- Coquille de cauri (Monetaria annulus / moneta, vue ventrale). Aplats purs, 2 teintes, registre du brief cauri. SEUIL MESURE : masquer le groupe 'fente' sous 18 px de LARGEUR DE COQUILLE a l'ecran (en dessous, la fente devient une tache qui salit la forme au lieu de la detailler ; la silhouette nue est alors plus lisible). Entre 18 et 26 px la fente n'a plus de dents mais reste un croissant utile. Au-dessus de 26 px les dents se comptent. Voir planche-echelles.png et NOTES.md. -->
