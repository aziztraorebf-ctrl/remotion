<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foster - notification stack plate</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1179px; height:2556px; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:#fff; overflow:hidden; position:relative; background:#0a0a0c;
  }
  .wall { position:absolute; inset:0; }
  .dune { position:absolute; left:-25%; width:150%; filter:blur(26px); }
  .d1 { top:58%; height:34%; border-radius:50% 50% 0 0 / 100% 100% 0 0;
        background:linear-gradient(180deg,#303035 0%,#191a1d 60%,#0e0e10 100%); opacity:.55; }
  .d2 { top:70%; height:30%; border-radius:50% 50% 0 0 / 100% 100% 0 0;
        background:linear-gradient(180deg,#232327 0%,#121214 70%,#0a0a0c 100%); opacity:.6; }
  .d3 { top:82%; height:26%; border-radius:50% 50% 0 0 / 100% 100% 0 0;
        background:linear-gradient(180deg,#1e1e22 0%,#0b0b0d 100%); }

  /* Pile de notifications : la NOTIF OFSTED en haut, les intrus dessous. */
  .stack { position:absolute; top:300px; left:74px; right:74px; display:flex;
           flex-direction:column; gap:26px; }

  .card { background:rgba(38,38,42,.82); -webkit-backdrop-filter:blur(30px);
          backdrop-filter:blur(30px); border-radius:44px; padding:34px 38px;
          box-shadow:0 2px 30px rgba(0,0,0,.4); position:relative; }
  /* Les notifications SYSTEME (mail/message) sont plus claires : elles
     recouvrent, elles ne se fondent pas dans le fond. */
  .card.sys { background:rgba(150,150,155,.62); }

  .row { display:flex; gap:26px; align-items:flex-start; }
  .avwrap { position:relative; flex:0 0 78px; width:78px; height:78px; margin-top:2px; }
  .avatar { width:78px; height:78px; border-radius:50%; position:relative; overflow:hidden;
            background:radial-gradient(circle at 50% 34%, #f6d3ad 0%, #e8b98c 55%, #c9946a 100%); }
  .avatar .hair { position:absolute; left:-6%; right:-6%; top:-14%; height:52%;
                  border-radius:50% 50% 44% 44% / 70% 70% 30% 30%; background:#5b4632; opacity:.92; }
  .dot { position:absolute; right:-1px; bottom:0; width:24px; height:24px; border-radius:50%;
         background:#30d158; border:4px solid #26262a; }
  .ntxt { flex:1; min-width:0; }
  .nhead { display:flex; justify-content:space-between; align-items:baseline; }
  .nfrom { font-size:33px; font-weight:600; }
  .nwhen { font-size:29px; opacity:.55; }
  .nbody { font-size:33px; line-height:1.28; margin-top:5px; opacity:.97; }

  /* La REPONSE en cours de frappe vit DANS la meme bulle que la notification
     (mesure sur la reference : meme carte, y~540 sur 1080). */
  .reply { display:flex; justify-content:space-between; align-items:center;
           margin-top:26px; min-height:56px; }
  .rtxt { font-size:33px; opacity:.92; }
  .rbtn { background:#0a84ff; color:#fff; font-size:28px; font-weight:600;
          padding:12px 30px; border-radius:30px; opacity:0; }
  .rbtn.on { opacity:1; }

  /* Icones des notifications systeme */
  .app { width:78px; height:78px; border-radius:18px; flex:0 0 78px; position:relative;
         display:flex; align-items:center; justify-content:center; font-size:40px;
         font-weight:700; }
  .app.mail { background:#fff; color:#d93025; }
  .app.msg  { background:#30d158; color:#fff; }
  .badge { position:absolute; right:-10px; top:-10px; background:#ff3b30; color:#fff;
           font-size:24px; font-weight:700; border-radius:24px; padding:3px 12px; }
  .stitle { font-size:33px; font-weight:500; opacity:.95; }

  .bottom { position:absolute; bottom:150px; left:0; right:0; display:flex;
            justify-content:center; align-items:center; gap:340px; }
  .torch { border:5px solid #fff; border-radius:8px 8px 14px 14px; width:34px; height:56px; }
  .cam { border:5px solid #fff; border-radius:14px; width:56px; height:46px; position:relative; }
  .cam:after{ content:""; position:absolute; inset:12px; border:4px solid #fff; border-radius:50%; }
  .persona { position:absolute; bottom:152px; left:0; right:0; text-align:center;
             font-size:28px; opacity:.8; }
  .home { position:absolute; bottom:46px; left:50%; transform:translateX(-50%);
          width:420px; height:12px; border-radius:6px; background:rgba(255,255,255,.85); }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="wall"><div class="dune d1"></div><div class="dune d2"></div><div class="dune d3"></div></div>

  <div class="stack">
    <!-- La notification d'origine, qui s'etend pour accueillir la reponse -->
    <div class="card" id="ofsted">
      <div class="row">
        <div class="avwrap"><div class="avatar"><div class="hair"></div></div><div class="dot"></div></div>
        <div class="ntxt">
          <div class="nhead"><span class="nfrom">Head Of Service</span><span class="nwhen">now</span></div>
          <div class="nbody">Ofsted are coming. Can you assemble an evidence pack?</div>
        </div>
      </div>
      <div class="reply hidden" id="replyrow">
        <span class="rtxt" id="rtxt"></span>
        <span class="rbtn" id="rbtn">Reply</span>
      </div>
    </div>

    <!-- Les intrus : ils S'EMPILENT et font monter les compteurs -->
    <div class="card sys hidden" id="n1">
      <div class="row">
        <div class="app mail">M<span class="badge" id="b1">11+</span></div>
        <div class="stitle">You got a new mail</div>
      </div>
    </div>
    <div class="card sys hidden" id="n2">
      <div class="row">
        <div class="app msg">&#9679;<span class="badge" id="b2">13+</span></div>
        <div class="stitle">You got a new message</div>
      </div>
    </div>
    <div class="card sys hidden" id="n3">
      <div class="row">
        <div class="app mail">M<span class="badge" id="b3">17+</span></div>
        <div class="stitle">You got a new mail</div>
      </div>
    </div>
  </div>

  <div class="persona">&#9679; Personal</div>
  <div class="bottom"><div class="torch"></div><div class="cam"></div></div>
  <div class="home"></div>

<script>
  /**
   * Etats MESURES sur la reference (plan 2, 1,602 -> 5,597 s) :
   *  r0  1,62  notification seule
   *  r1  2,05  « I'll »
   *  r2  2,35  « I'll see »
   *  r3  2,50  « I'll see how long »
   *  r4  2,65  « I'll see how long it » + bouton Reply
   *  r5  3,00  « I'll see how long it takes » (phrase finie)
   *  s1  3,80  + « You got a new mail » 11+
   *  s2  4,30  + « You got a new message » 13+
   *  s3  4,80  + « You got a new mail » 17+
   */
  var TXT = {
    r0: null, r1: "I'll", r2: "I'll see", r3: "I'll see how long",
    r4: "I'll see how long it", r5: "I'll see how long it takes"
  };
  var st = new URLSearchParams(location.search).get('state') || 'r0';
  var base = st.charAt(0) === 's' ? 'r5' : st;
  if (TXT[base]) {
    document.getElementById('replyrow').classList.remove('hidden');
    document.getElementById('rtxt').textContent = TXT[base];
    if (base === 'r4' || base === 'r5') document.getElementById('rbtn').classList.add('on');
  }
  var n = st.charAt(0) === 's' ? parseInt(st.slice(1), 10) : 0;
  for (var i = 1; i <= n; i++) document.getElementById('n' + i).classList.remove('hidden');
</script>
</body>
</html>
