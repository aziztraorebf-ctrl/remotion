<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NorthShield — Activite de connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0A1628; --navy-panel:#0F1F38; --ivory:#F4F1EA; --ivory-muted:#A8B0C0;
    --cyan:#00D9FF; --cyan-dim:#00D9FF33; --green:#3DDC97; --amber:#FFB020; --red:#FF4D5E;
    --display:'Space Grotesk','Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1920px;height:1080px;background:var(--navy-deep);font-family:var(--display);
       display:flex;flex-direction:column;justify-content:center;padding:0 96px;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
  .brand{display:flex;align-items:center;gap:16px}
  .logo{width:40px;height:40px;border-radius:10px;
        background:linear-gradient(135deg,var(--cyan),var(--navy-panel));
        display:flex;align-items:center;justify-content:center;
        font-weight:700;color:var(--navy-deep);font-size:20px}
  .brand-name{color:var(--ivory);font-size:26px;font-weight:700;letter-spacing:1px}
  .brand-sub{margin-left:12px;color:var(--ivory-muted);font-family:var(--mono);font-size:16px}
  .badge{font-family:var(--mono);font-size:14px;color:var(--ivory-muted);
         padding:8px 18px;border:1px solid var(--navy-panel);border-radius:999px}
  .searchbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:14px 20px;
             border:1px solid var(--navy-panel);border-radius:10px;background:#0C1A2E;width:560px}
  .searchbar .ph{font-family:var(--mono);font-size:16px;color:var(--ivory-muted)}
  .grid{display:grid;grid-template-columns:90px 1.3fr 1.3fr 1.1fr 100px 1.4fr;align-items:center}
  .thead{padding:0 28px 18px;border-bottom:1px solid var(--navy-panel);
         font-family:var(--mono);font-size:14px;color:var(--ivory-muted);letter-spacing:1px}
  .row{padding:26px 28px;border-radius:16px;border:1px solid transparent}
  .row.is-flagged{background:var(--navy-panel);border-color:var(--cyan-dim);
                  box-shadow:0 0 32px rgba(255,77,94,.13)}
  .c-time{font-family:var(--mono);color:var(--ivory-muted);font-size:16px}
  .c-user{color:var(--ivory);font-size:24px;font-weight:600}
  .c-device,.c-loc{font-family:var(--mono);color:var(--ivory-muted);font-size:17px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;
        font-size:15px;font-weight:600;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
  .gauge{display:block}
</style>
</head>
<body>
  <header data-capture="nav">
    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-name">NorthShield</div>
      <div class="brand-sub">Activite de connexion</div>
    </div>
    <div class="badge">Admin IT — Vue en temps reel</div>
  </header>

  <div class="searchbar" data-capture="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8B0C0" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span class="ph">Rechercher un utilisateur, un appareil...</span>
  </div>

  <div class="grid thead" data-capture="thead">
    <div>HEURE</div><div>UTILISATEUR</div><div>APPAREIL</div>
    <div>LOCALISATION</div><div>SCORE</div><div>ACTION</div>
  </div>

  <div id="rows"></div>

<script>
const ROWS = [
  {time:"08:02",user:"David K.",device:"iPhone 15",loc:"Toronto, CA",score:6,action:"Autorise"},
  {time:"08:41",user:"Amina T.",device:"ThinkPad X1",loc:"Montreal, CA",score:22,action:"Autorise"},
  {time:"08:57",user:"Marc L.",device:"MacBook Air",loc:"Toronto, CA",score:14,action:"Autorise"},
  {time:"09:14",user:"Sarah M.",device:"MacBook Pro",loc:"Toronto, CA",score:18,action:"Autorise"},
  {time:"10:26",user:"Julien P.",device:"Pixel 9",loc:"Ottawa, CA",score:31,action:"Autorise"},
  {time:"11:08",user:"Fatou N.",device:"MacBook Pro",loc:"Toronto, CA",score:12,action:"Autorise"},
  {time:"12:47",user:"Sarah M.",device:"Appareil inconnu",loc:"Berlin, DE",score:82,action:"Verification requise",flagged:true},
];
const color = s => s < 40 ? "var(--green)" : s < 70 ? "var(--amber)" : "var(--red)";
const gauge = (score, size) => {
  const stroke = 6, r = (size - stroke) / 2, c = 2 * Math.PI * r, accent = color(score);
  return `<svg class="gauge" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--navy-panel)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${accent}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2 + size*0.09}" text-anchor="middle" fill="var(--ivory)"
      font-family="var(--mono)" font-size="${size*0.28}" font-weight="600">${score}</text></svg>`;
};
document.getElementById("rows").innerHTML = ROWS.map(r => `
  <div class="grid row ${r.flagged ? "is-flagged" : ""}" data-capture="row">
    <div class="c-time">${r.time}</div>
    <div class="c-user">${r.user}</div>
    <div class="c-device">${r.device}</div>
    <div class="c-loc">${r.loc}</div>
    <div>${gauge(r.score, r.flagged ? 76 : 56)}</div>
    <div><span class="pill" style="color:${color(r.score)};background:${color(r.score)}22;border:1px solid ${color(r.score)}66"><span class="dot"></span>${r.action}</span></div>
  </div>`).join("");
</script>
</body>
</html>
