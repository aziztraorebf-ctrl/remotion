<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NorthShield — Activite de connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFBFD; --panel:#FFFFFF; --ink:#0F1729; --ink-muted:#6B7688;
    --line:#E6E9EF; --line-soft:#F0F2F6;
    --accent:#0B63F6; --accent-soft:#E8F0FE;
    --green:#0F9D58; --amber:#B7791F; --red:#D93A47; --red-soft:#FDECEE;
    --display:'Space Grotesk','Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1920px;height:1080px;background:var(--bg);font-family:var(--display);
       display:flex;flex-direction:column;justify-content:center;padding:0 96px;overflow:hidden;
       -webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
  .brand{display:flex;align-items:center;gap:16px}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--accent);
        display:flex;align-items:center;justify-content:center;
        font-weight:700;color:#fff;font-size:20px}
  .brand-name{color:var(--ink);font-size:26px;font-weight:700;letter-spacing:-.2px}
  .brand-sub{margin-left:12px;color:var(--ink-muted);font-family:var(--mono);font-size:16px}
  .badge{font-family:var(--mono);font-size:14px;color:var(--ink-muted);
         padding:8px 18px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .searchbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:14px 20px;
             border:1px solid var(--line);border-radius:10px;background:var(--panel);width:560px;
             box-shadow:0 1px 2px rgba(15,23,41,.04)}
  .searchbar .ph{font-family:var(--mono);font-size:16px;color:var(--ink-muted)}
  .table{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
         box-shadow:0 1px 3px rgba(15,23,41,.05)}
  .grid{display:grid;grid-template-columns:90px 1.3fr 1.3fr 1.1fr 100px 1.4fr;align-items:center}
  .thead{padding:18px 28px;border-bottom:1px solid var(--line);background:#FAFBFC;
         font-family:var(--mono);font-size:13px;color:var(--ink-muted);letter-spacing:1px}
  .row{padding:26px 28px;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:none}
  .row.is-flagged{background:var(--red-soft);box-shadow:inset 3px 0 0 var(--red)}
  .c-time{font-family:var(--mono);color:var(--ink-muted);font-size:16px}
  .c-user{color:var(--ink);font-size:24px;font-weight:600}
  .c-device,.c-loc{font-family:var(--mono);color:var(--ink-muted);font-size:17px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;
        font-size:15px;font-weight:600;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
</style>
</head>
<body>
  <header data-capture="nav">
    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-name">NorthShield</div>
      <div class="brand-sub">Activite de connexion</div>
    </div>
    <div class="badge">Admin IT — Vue en temps reel</div>
  </header>

  <div class="searchbar" data-capture="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7688" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span class="ph">Rechercher un utilisateur, un appareil...</span>
  </div>

  <div class="table">
    <div class="grid thead" data-capture="thead">
      <div>HEURE</div><div>UTILISATEUR</div><div>APPAREIL</div>
      <div>LOCALISATION</div><div>SCORE</div><div>ACTION</div>
    </div>
    <div id="rows"></div>
  </div>

<script>
const ROWS = [
  {time:"08:02",user:"David K.",device:"iPhone 15",loc:"Toronto, CA",score:6,action:"Autorise"},
  {time:"08:41",user:"Amina T.",device:"ThinkPad X1",loc:"Montreal, CA",score:22,action:"Autorise"},
  {time:"08:57",user:"Marc L.",device:"MacBook Air",loc:"Toronto, CA",score:14,action:"Autorise"},
  {time:"09:14",user:"Sarah M.",device:"MacBook Pro",loc:"Toronto, CA",score:18,action:"Autorise"},
  {time:"10:26",user:"Julien P.",device:"Pixel 9",loc:"Ottawa, CA",score:31,action:"Autorise"},
  {time:"11:08",user:"Fatou N.",device:"MacBook Pro",loc:"Toronto, CA",score:12,action:"Autorise"},
  {time:"12:47",user:"Sarah M.",device:"Appareil inconnu",loc:"Berlin, DE",score:82,action:"Verification requise",flagged:true},
];
const color = s => s < 40 ? "var(--green)" : s < 70 ? "var(--amber)" : "var(--red)";
const gauge = (score, size) => {
  const stroke = 6, r = (size - stroke) / 2, c = 2 * Math.PI * r, accent = color(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EDEFF3" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${accent}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2 + size*0.09}" text-anchor="middle" fill="#0F1729"
      font-family="var(--mono)" font-size="${size*0.28}" font-weight="600">${score}</text></svg>`;
};
document.getElementById("rows").innerHTML = ROWS.map(r => `
  <div class="grid row ${r.flagged ? "is-flagged" : ""}" data-capture="row">
    <div class="c-time">${r.time}</div>
    <div class="c-user">${r.user}</div>
    <div class="c-device">${r.device}</div>
    <div class="c-loc">${r.loc}</div>
    <div>${gauge(r.score, r.flagged ? 76 : 56)}</div>
    <div><span class="pill" style="color:${color(r.score)};background:${color(r.score)}14;border:1px solid ${color(r.score)}33"><span class="dot"></span>${r.action}</span></div>
  </div>`).join("");
</script>
</body>
</html>
