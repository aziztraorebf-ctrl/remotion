<!--
  perso-neutre-v3.svg - personnage generique neutre, corps entier, de face - V3 COLONNE
  Dessin original vise sur la CONSTRUCTION des pieces pro du corpus (autorise) :
  ratios du douanier (silhouette colonne : deux-jambes ~= torse, taille droite,
  membres epais, cou large), economie de la marcheuse (~55 formes visibles,
  mains-galets, visage a points), souliers forme hiker en teinte accent.
  15 calques rig + ETATS DE VISAGE caches (tete-bouche-a/b/c, tete-paupiere-g/d).
  Pivots x,y anatomiques ; rotules invisibles au repos (meme couleur, incluses) ;
  ombres portees articulaires dans le calque RECEVEUR ; bandes d'ombre continues
  a travers les joints. Zero degrade. Calibre 600-1080 px, fond clair.
-->
