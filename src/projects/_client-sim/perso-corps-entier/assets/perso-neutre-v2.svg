<!--
  perso-neutre-v2.svg - personnage generique neutre, corps entier, de face - V2 MARCHEUR
  Dessin ORIGINAL (aucun sommet emprunte). Registre : aplats francs, zero degrade,
  ombres en aplat a 2 niveaux, teintes d'ombre decalees. References regardees :
  douanier-style.png (registre), hiker-marcheur-a/b.png (marcheur, mains, chaussures),
  exercise.png (grandes ombres, chaussette, sneaker).
  15 calques a plat sous "controle", pivots x,y ANATOMIQUES, pastilles de rotule
  (coude, genou, epaule, hanche, poignet, cheville=chaussette) dans le calque ENFANT.
  Ombres portees aux articulations : dans le calque RECEVEUR (suivent la rotation).
  Calibre pour un affichage 600-1080 px de haut, fond clair.
-->
