      <path id="jambe-d-ourlet" fill="#2F3850" d="M 242,780 L 208,780 L 209,798 L 241,798 Z"/>
      <path id="jambe-d-chaussure" fill="#7A4E33" d="M 244,792 C 249,806 252,822 250,838 C 249,850 242,858 228,858 C 214,858 206,852 205,840 C 204,826 206,808 208,794 C 219,798 233,798 244,792 Z"/>
      <path id="jambe-d-semelle" fill="#4E3020" d="M 251,845 L 204,845 C 202,849 202,856 205,859 C 212,863 242,863 247,859 C 251,856 252,850 251,845 Z"/>
