      <path id="main-d-doigt-ligne-2" fill="#D08D62" d="M 289,468 L 286,468 L 286,487 L 289,487 Z"/>
    </g>

    <!-- ============ AVANT-BRAS (manches longues, sommet cache sous le bras haut) ============ -->
    <g id="bras-g-bas" data-parent="bras-g-haut" data-pivot="haut">
      <path id="bras-g-bas-manche" fill="#2F7D6B" d="M 115,330 C 124,330 130,337 129,348 C 128,380 126,412 124,436 C 123,448 117,455 108,454 C 99,453 93,445 94,433 C 97,404 99,372 101,346 C 102,336 106,330 115,330 Z"/>
      <path id="bras-g-bas-ombre" fill="#266657" d="M 128,360 C 127,386 126,410 124,432 L 119,433 C 121,410 122,386 123,360 Z"/>
      <path id="bras-g-bas-ourlet" fill="#266657" d="M 94,432 C 103,438 115,439 124,435 L 124,447 C 115,452 102,451 94,444 Z"/>
    </g>
    <g id="bras-d-bas" data-parent="bras-d-haut" data-pivot="haut">
      <path id="bras-d-bas-manche" fill="#2F7D6B" d="M 285,330 C 276,330 270,337 271,348 C 272,380 274,412 276,436 C 277,448 283,455 292,454 C 301,453 307,445 306,433 C 303,404 301,372 299,346 C 298,336 294,330 285,330 Z"/>
