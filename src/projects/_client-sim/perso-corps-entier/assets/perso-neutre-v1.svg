<!--
  perso-neutre.svg - personnage generique neutre, corps entier, de face
  Dessin ORIGINAL (aucun sommet emprunte). Registre repris de la reference de style
  out/_r-and-d/perso-corps-entier/ref/douanier-style.png : aplats francs, zero degrade,
  zero texture, lignes de plis fines, tete ronde, proportions stylisees (tete ~1/7).
  Structure riggable : 11 calques a plat sous "controle", data-parent + data-pivot,
  recouvrements caches >=15% sous chaque piece parente. Statique : le mouvement
  sera ajoute par code (rotations aux pivots uniquement).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900">
  <g id="controle">

    <!-- ============ MAINS (tout en arriere : glissent sous les manches) ============ -->
    <g id="main-g" data-parent="bras-g-bas" data-pivot="haut">
