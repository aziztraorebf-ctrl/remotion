      <path id="main-g-pouce" fill="#E9A97E" d="M 120,452 C 126,454 129,461 127,469 C 126,475 121,477 117,474 L 117,458 Z"/>
      <path id="main-g-doigt-ligne-1" fill="#D08D62" d="M 102,466 L 105,466 L 105,486 L 102,486 Z"/>
      <path id="main-g-doigt-ligne-2" fill="#D08D62" d="M 111,468 L 114,468 L 114,487 L 111,487 Z"/>
    </g>
    <g id="main-d" data-parent="bras-d-bas" data-pivot="haut">
