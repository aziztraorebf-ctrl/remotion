      <path id="jambe-g-semelle" fill="#4E3020" d="M 149,845 L 196,845 C 198,849 198,856 195,859 C 188,863 158,863 153,859 C 149,856 148,850 149,845 Z"/>
      <path id="jambe-g-lacet-1" fill="#5E3B26" d="M 159,812 C 167,816 178,816 186,812 L 186,816 C 178,820 167,820 159,816 Z"/>
