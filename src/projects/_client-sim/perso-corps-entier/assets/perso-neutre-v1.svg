      <path id="jambe-d-lacet-2" fill="#5E3B26" d="M 242,824 C 233,828 221,828 213,824 L 213,828 C 221,832 233,832 242,828 Z"/>
    </g>

    <!-- ============ TETE (le cou plonge sous le col du torse) ============ -->
    <g id="tete" data-parent="torse" data-pivot="bas">
      <rect id="tete-cou" fill="#E9A97E" x="184" y="168" width="32" height="74" rx="13"/>
      <ellipse id="tete-cou-ombre" fill="#D08D62" cx="200" cy="194" rx="15" ry="8"/>
