<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Flowdesk — Etat initial : surcharge des demandes internes</title>

  <defs>
    <!-- Palette stricte : #0B1F3A / #FFFFFF / #FF6B1A -->

    <!-- Halo tres discret derriere la personne : donne de la profondeur sans casser le flat -->
    <radialGradient id="deskHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Carte d'icone : fond creme constant (flat), pas de degrade -->
    <g id="iconCardShape">
      <rect x="-58" y="-58" width="116" height="116" rx="26" fill="#FFFFFF"/>
    </g>

    <!-- ============ PICTOGRAMMES (formes geometriques simples) ============ -->

    <!-- Enveloppe : rectangle + rabat en V, trace epais -->
    <g id="icoMail">
      <rect x="-34" y="-24" width="68" height="48" rx="7" fill="none" stroke="#0B1F3A" stroke-width="7"/>
      <path d="M-30 -18 L0 4 L30 -18" fill="none" stroke="#0B1F3A" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bulle de chat : rectangle arrondi + queue triangulaire -->
    <g id="icoChat">
      <path d="M-34 -26 H34 A10 10 0 0 1 44 -16 V10 A10 10 0 0 1 34 20 H2 L-12 34 L-12 20 H-34
               A10 10 0 0 1 -44 10 V-16 A10 10 0 0 1 -34 -26 Z"
            fill="#0B1F3A"/>
      <rect x="-26" y="-12" width="44" height="7" rx="3.5" fill="#FFFFFF"/>
      <rect x="-26" y="2" width="30" height="7" rx="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Telephone : combine stylise (forme en L arrondi) -->
    <g id="icoPhone">
      <path d="M-26 -30 C-26 -36 -20 -40 -14 -37 L-2 -30 C3 -27 4 -21 1 -16 L-6 -6
               C2 8 14 20 28 28 L38 21 C43 18 49 19 52 24 L59 36 C62 42 58 48 52 48
               C10 48 -26 12 -26 -30 Z"
            fill="#0B1F3A" transform="translate(-14,-6) scale(0.86)"/>
    </g>

    <!-- Document / formulaire : feuille avec coin plie + lignes -->
    <g id="icoDoc">
      <path d="M-26 -34 H10 L30 -14 V34 H-26 Z" fill="#0B1F3A"/>
      <path d="M10 -34 V-14 H30 Z" fill="#FFFFFF" opacity="0.55"/>
      <rect x="-16" y="0" width="34" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="-16" y="14" width="24" height="6" rx="3" fill="#FFFFFF"/>
    </g>

    <!-- Ordinateur portable : ecran + base trapeze -->
    <g id="icoLaptop">
      <rect x="-28" y="-28" width="56" height="38" rx="5" fill="none" stroke="#0B1F3A" stroke-width="7"/>
      <path d="M-40 20 H40 L34 32 H-34 Z" fill="#0B1F3A"/>
    </g>

    <!-- Utilisateur / demande RH : tete + epaules -->
    <g id="icoUser">
      <circle cx="0" cy="-16" r="14" fill="#0B1F3A"/>
      <path d="M-26 30 C-26 12 -14 2 0 2 C14 2 26 12 26 30 Z" fill="#0B1F3A"/>
    </g>

    <!-- Facture / approbation : etiquette avec symbole de validation -->
    <g id="icoCheck">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#0B1F3A" stroke-width="7"/>
      <path d="M-14 1 L-4 12 L15 -10" fill="none" stroke="#0B1F3A" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ==================== FOND ==================== -->
  <rect width="1920" height="1080" fill="#0B1F3A"/>

  <!-- Halo doux centre sur le poste de travail -->
  <ellipse cx="960" cy="720" rx="640" ry="380" fill="url(#deskHalo)"/>

  <!-- ==================== PERSONNE + BUREAU ====================
       Construction anatomique : points d'ancrage planifies.
       Assise de profil 3/4, tournee vers l'ecran.
       Epaule Y=628 · coude Y=716 · poignet Y=760 · plateau bureau Y=790
  -->
  <g id="scene-personne">

    <!-- - Chaise : dossier derriere la silhouette - -->
    <g id="chaise" fill="#FFFFFF" opacity="0.16">
      <path d="M732 600 C732 578 748 564 770 564 L806 564 C828 564 844 578 844 600
               L844 790 L732 790 Z"/>
      <rect x="770" y="790" width="20" height="86" rx="10"/>
      <path d="M714 876 H846 L852 900 H708 Z"/>
    </g>

    <!-- Corps : silhouette assise de trois-quarts, main au visage (accablement).
         Ancrages resolus par cinematique inverse, canon tete H=116 :
         bras 128 px, avant-bras 116 px.
           tete (872,500) . cou (872,566)
           epaule avant (812,568) . coude avant (846,688) . poignet (886,586)
           epaule arriere (902,584) . coude arriere (1000,666) . poignet (1046,772)
         Le coude avant est a Y=688, soit 100 px AU-DESSUS du plateau (Y=790) :
         tout le geste reste visible. Les membres sont traces en CAPSULES qui se
         recouvrent au coude (un ruban a offset unique s'auto-intersecte sur un
         pli de 55 deg : verifie, c'est ce qui cassait les versions precedentes). -->
    <g id="silhouette">

      <!-- ===== BRAS DROIT (cote laptop) : epaule(926,586) - coude(1032,656) - main(1052,770).
           Coude a x=1032, hors du torse (bord 932) : le pli reste lisible.
           Legerement assombri pour marquer le second plan. ===== -->
      <g fill="#FFFFFF" opacity="0.76">
        <path d="M914.4 603.5 L1023.2 669.4 A16.0 16.0 0 0 0 1040.8 642.6 L937.6 568.5 A21.0 21.0 0 0 0 914.4 603.5 Z"/>
        <path d="M1016.2 658.8 L1039.2 772.2 A13.0 13.0 0 0 0 1064.8 767.8 L1047.8 653.2 A16.0 16.0 0 0 0 1016.2 658.8 Z"/>
        <!-- Main droite posee sur le bureau (forme simplifiee, pas de doigts) -->
        <ellipse cx="1058" cy="772" rx="30" ry="20"/>
      </g>

      <g fill="#FFFFFF">
        <!-- ===== TORSE : bords x=812..932 (largeur 120).
             Volontairement plus etroit que l'envergure des epaules pour que les
             DEUX bras restent lisibles hors de la masse du torse. ===== -->
        <path d="M812 610
                 C806 654 800 720 798 790
                 L946 790
                 C944 720 938 654 932 610
                 C924 570 902 550 872 550
                 C842 550 820 570 812 610
                 Z"/>

        <!-- Cou : court, degage la ligne d'epaules -->
        <path d="M852 512 L892 512 L896 566 L850 566 Z"/>

        <!-- Tete : ovale sans visage, tres legerement penchee -->
        <ellipse cx="872" cy="500" rx="52" ry="58" transform="rotate(6 872 500)"/>

        <!-- ===== BRAS GAUCHE : epaule(818,574) - coude(722,658) - main(742,772).
             Coude a x=722, bien degage du torse. ===== -->
        <path d="M804.2 558.2 L711.5 646.0 A16.0 16.0 0 0 0 732.5 670.0 L831.8 589.8 A21.0 21.0 0 0 0 804.2 558.2 Z"/>
        <path d="M706.2 660.8 L729.2 774.2 A13.0 13.0 0 0 0 754.8 769.8 L737.8 655.2 A16.0 16.0 0 0 0 706.2 660.8 Z"/>
        <!-- Main gauche posee sur le bureau -->
        <ellipse cx="736" cy="774" rx="30" ry="20"/>
        <!-- Rondeur d'epaule : raccorde proprement le bras au torse -->
        <circle cx="818" cy="572" r="21"/>
      </g>
    </g>

    <!-- - Bureau : plateau + pietement, en blanc pour trancher sur le fond - -->
    <g id="bureau">
      <rect x="640" y="790" width="700" height="22" rx="8" fill="#FFFFFF"/>
      <rect x="676" y="812" width="16" height="130" fill="#FFFFFF" opacity="0.55"/>
      <rect x="1288" y="812" width="16" height="130" fill="#FFFFFF" opacity="0.55"/>
    </g>

    <!-- - Ordinateur portable sur le bureau (detail, pas sujet) - -->
    <g id="laptop-bureau">
      <!-- Ecran : legerement de trois-quarts -->
      <path d="M1130 654 L1294 654 L1308 782 L1124 782 Z" fill="#FFFFFF" opacity="0.20"/>
      <path d="M1130 654 L1294 654 L1308 782 L1124 782 Z" fill="none" stroke="#FFFFFF"
            stroke-width="6" stroke-linejoin="round"/>
      <!-- Lignes de contenu : une seule en orange = la demande urgente -->
      <rect x="1154" y="688" width="112" height="9" rx="4.5" fill="#FFFFFF" opacity="0.5"/>
      <rect x="1154" y="710" width="86" height="9" rx="4.5" fill="#FF6B1A"/>
      <rect x="1154" y="732" width="104" height="9" rx="4.5" fill="#FFFFFF" opacity="0.5"/>
      <!-- Base / clavier -->
      <path d="M1108 782 H1324 L1336 802 H1096 Z" fill="#FFFFFF"/>
    </g>

    <!-- - Tasse : petit detail de vie, cote gauche du bureau - -->
    <g id="tasse">
      <path d="M958 748 H1002 L997 786 H963 Z" fill="#FFFFFF" opacity="0.5"/>
      <path d="M1002 757 C1015 757 1015 775 1002 775" fill="none" stroke="#FFFFFF"
            stroke-width="6" opacity="0.5"/>
    </g>
  </g>

  <!-- ==================== SIGNAUX QUI ASSAILLENT ====================
       8 cartes disposees en arc autour de la personne, tailles variables
       (les plus proches = plus grandes). Aucune ne touche la silhouette.
       Espace negatif preserve : rien au-dessus de Y<110, rien sous Y>950 hors bureau.
  -->
  <g id="signaux">

    <!-- 1 — Email, haut gauche, grande (le plus present) -->
    <g transform="translate(392,300) rotate(-9)">
      <use href="#iconCardShape"/>
      <use href="#icoMail"/>
    </g>

    <!-- 2 — Chat, gauche milieu -->
    <g transform="translate(286,556) rotate(6) scale(0.9)">
      <use href="#iconCardShape"/>
      <use href="#icoChat"/>
    </g>

    <!-- 3 — Document / formulaire, gauche bas -->
    <g transform="translate(430,762) rotate(-5) scale(0.82)">
      <use href="#iconCardShape"/>
      <use href="#icoDoc"/>
    </g>

    <!-- 4 — Notification, haut centre-gauche, ACCENT ORANGE (le signal qui crie) -->
    <g transform="translate(660,192) rotate(7)">
      <rect x="-58" y="-58" width="116" height="116" rx="26" fill="#FF6B1A"/>
      <g>
        <path d="M0 -34 C14 -34 24 -24 24 -10 L24 6 L32 18 L-32 18 L-24 6 L-24 -10
                 C-24 -24 -14 -34 0 -34 Z" fill="#FFFFFF"/>
        <rect x="-5" y="-42" width="10" height="10" rx="5" fill="#FFFFFF"/>
        <path d="M-9 26 A9 9 0 0 0 9 26 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 5 — Utilisateur / demande RH, haut centre-droit -->
    <g transform="translate(1010,168) rotate(-6) scale(0.92)">
      <use href="#iconCardShape"/>
      <use href="#icoUser"/>
    </g>

    <!-- 6 — Ordinateur / demande materiel, haut droite -->
    <g transform="translate(1330,282) rotate(8)">
      <use href="#iconCardShape"/>
      <use href="#icoLaptop"/>
    </g>

    <!-- 7 — Telephone, droite milieu -->
    <g transform="translate(1552,520) rotate(-7) scale(0.94)">
      <use href="#iconCardShape"/>
      <use href="#icoPhone"/>
    </g>

    <!-- 8 — Facture a approuver, droite bas -->
    <g transform="translate(1470,742) rotate(5) scale(0.84)">
      <use href="#iconCardShape"/>
      <use href="#icoCheck"/>
    </g>

    <!-- Petits badges orange : compteurs non lus, accents ponctuels -->
    <circle cx="440" cy="252" r="17" fill="#FF6B1A"/>
    <circle cx="1382" cy="234" r="14" fill="#FF6B1A"/>
    <circle cx="1516" cy="700" r="12" fill="#FF6B1A"/>
  </g>

  <!-- ==================== LIGNES DE PRESSION ====================
       Traits fins convergeant vers la personne : rendent la "pression" lisible
       sans surcharger. Opacite basse pour rester epure.
  -->
  <g id="lignes-pression" fill="none" stroke="#FFFFFF" stroke-width="2.5"
     stroke-linecap="round" opacity="0.28">
    <path d="M462 352 C566 404 656 448 744 490"/>
    <path d="M362 566 C486 570 594 578 700 588"/>
    <path d="M492 742 C570 722 638 702 704 678"/>
    <path d="M676 264 C700 340 724 404 748 462"/>
    <path d="M1000 240 C990 320 976 396 960 458"/>
    <path d="M1268 330 C1180 400 1090 458 1010 504"/>
    <path d="M1484 546 C1352 578 1216 602 1090 618"/>
    <path d="M1410 762 C1322 744 1236 726 1156 710"/>
  </g>

  <!-- Une seule ligne orange : la demande urgente qui perce jusqu'a l'ecran -->
  <path d="M676 264 C700 340 724 404 748 462" fill="none" stroke="#FF6B1A"
        stroke-width="3.5" stroke-linecap="round" stroke-dasharray="14 20" opacity="0.9"/>

  <!-- ==================== SOL ==================== -->
  <path d="M520 942 H1420" stroke="#FFFFFF" stroke-width="3" opacity="0.14" stroke-linecap="round"/>
</svg>
