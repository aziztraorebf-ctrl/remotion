<!-- halo central discret (annonce le centre d'attention vers lequel tout va converger P2) -->
<ellipse id="chaos-center-halo" cx="960" cy="540" rx="140" ry="140" fill="#FF6B1A" opacity="0.06" filter="url(#c-blur6)"/>

<rect x="0" y="0" width="1920" height="1080" fill="url(#c-bgv)" opacity="0.12" style="mix-blend-mode:overlay"/>
