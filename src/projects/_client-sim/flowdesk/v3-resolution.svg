<!-- Fable 5 (mode MAX) - panneau 4 "RESOLUTION" V3 (2026-08-05, refonte semantique + plein cadre). -->
<!-- Anneau qui se ferme (grammaire V1/V2 conservee) + CHECKMARK net + mot TRAITE, reponse au -->
<!-- point de vigilance du brief original ET a la critique GPT (confirmation doit se lire, pas -->
<!-- juste un anneau orange abstrait). PLEIN CADRE 1920x1080. -->
<!-- Palette stricte : #0B1F3A fond / #FFFFFF / #FF6B1A accent. -->
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
<defs>
  <radialGradient id="r-bgSeal" cx="0.5" cy="0.5" r="0.85">
    <stop offset="0" stop-color="#1A3A68" stop-opacity="0.8"/>
    <stop offset="0.4" stop-color="#122B4E" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#0B1F3A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="r-bgWarm">
    <stop offset="0%" stop-color="#FF6B1A" stop-opacity="0.3"/>
    <stop offset="35%" stop-color="#FF6B1A" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#FF6B1A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="r-burst">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="10%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    <stop offset="30%" stop-color="#FFD9B4" stop-opacity="0.5"/>
    <stop offset="60%" stop-color="#FF6B1A" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#FF6B1A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="r-ringG" x1="0" y1="1" x2="0.65" y2="0">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
  </linearGradient>
  <filter id="r-glowO" x="-120%" y="-120%" width="340%" height="340%">
    <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FF6B1A" flood-opacity="0.9"/>
  </filter>
  <filter id="r-glowOSoft" x="-120%" y="-120%" width="340%" height="340%">
    <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF6B1A" flood-opacity="0.55"/>
  </filter>
</defs>

<rect width="1920" height="1080" fill="#0B1F3A"/>
<rect width="1920" height="1080" fill="url(#r-bgSeal)"/>
<rect width="1920" height="1080" fill="url(#r-bgWarm)"/>

<!-- ground lines discretes, plein cadre -->
<g id="res-ground" opacity="0.5" stroke="#FFFFFF" fill="none">
  <line x1="60" y1="1000" x2="1860" y2="1000" stroke-width="1"/>
  <line x1="120" y1="1040" x2="1800" y2="1040" stroke-width="1"/>
</g>

<!-- anneau ghost (repere), agrandi pour remplir davantage le cadre -->
<g id="res-seal-ghost" fill="none" stroke="#FFFFFF" opacity="0.3">
  <circle cx="960" cy="560" r="380" stroke-width="1.2"/>
  <circle cx="960" cy="560" r="330" stroke-width="1"/>
</g>

<!-- graduations autour de l'anneau (petits ticks) -->
<g id="res-seal-ticks" stroke="#FFFFFF" stroke-opacity="0.13" stroke-linecap="round">
</g>

<!-- ANNEAU PRINCIPAL, centre (960,560), r=340, agrandi vs premier jet, remplit mieux 1920x1080 -->
<g id="res-seal-arc">
  <path d="M 1300 560 A 340 340 0 1 1 720 268" stroke="#FF6B1A" stroke-opacity="0.3" stroke-width="26" filter="url(#r-glowOSoft)" fill="none"/>
  <path d="M 1300 560 A 340 340 0 1 1 720 268" stroke="url(#r-ringG)" stroke-width="11" fill="none"/>
  <path d="M 1276 560 A 316 316 0 1 1 738 292" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.8" fill="none"/>
</g>

<!-- APPROACH : trajectoire d'arrivee du paquet, depuis le coin haut-gauche du cadre -->
<g id="res-approach" fill="none" stroke-linecap="round">
  <path d="M 100 90 C 380 190 600 260 720 268" stroke="#FF6B1A" stroke-opacity="0.15" stroke-width="20" filter="url(#r-glowOSoft)"/>
  <path d="M 100 90 C 380 190 600 260 720 268" stroke="url(#r-ringG)" stroke-width="6"/>
</g>

<!-- PACKET : icone email qui voyage le long de l'approche (position figee = fin de trajectoire,
     anime en JSX via translate cote composant Remotion) -->
<g id="res-packet" transform="translate(720 268) rotate(18)" opacity="0.9">
  <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#FFD9B4" fill-opacity="0.6" stroke="#FF6B1A" stroke-opacity="0.95" stroke-width="2.2"/>
  <path d="M -20 -12 L 0 3 L 20 -12" fill="none" stroke="#FF6B1A" stroke-opacity="0.95" stroke-width="2.2"/>
</g>

<!-- SEAL WELD : le segment manquant de l'anneau qui se soude -->
<g id="res-seal-weld" fill="none" stroke-linecap="round">
  <path d="M 720 268 A 340 340 0 0 1 1300 560" stroke="#FF6B1A" stroke-opacity="1" stroke-width="12" filter="url(#r-glowO)"/>
  <path d="M 720 268 A 340 340 0 0 1 1300 560" stroke="#FFE2C6" stroke-opacity="0.95" stroke-width="4.2"/>
</g>

<!-- IMPACT : flash au moment de la fermeture -->
<g id="res-impact">
  <circle cx="1300" cy="560" r="105" fill="url(#r-burst)"/>
</g>

<!-- echos discrets a droite/bas, comblent le reste du cadre sans distraire du sujet principal -->
<g id="res-echoes" opacity="0.35">
  <circle cx="1650" cy="780" r="4" fill="#FFFFFF"/>
  <circle cx="1580" cy="860" r="3" fill="#FF6B1A"/>
  <circle cx="1720" cy="700" r="3" fill="#FFFFFF"/>
  <circle cx="280" cy="820" r="4" fill="#FFFFFF"/>
  <circle cx="360" cy="900" r="3" fill="#FF6B1A"/>
  <circle cx="1780" cy="900" r="3" fill="#FFFFFF"/>
</g>

<!-- CORE : centre lumineux + CHECKMARK + mot TRAITE, l'element qui doit dire "confirmation" -->
<g id="res-core" transform="translate(960 560)">
  <circle r="12" fill="#FFFFFF" opacity="0.5"/>
  <circle r="4" fill="#FF6B1A"/>
</g>

<!-- CHECKMARK + TRAITE, au centre de l'anneau, apparait au moment de la fermeture (anime cote
     composant), design net/simple : badge blanc + coche orange + mot dessous -->
<g id="res-confirm" transform="translate(960 560)">
  <circle r="76" fill="#FFFFFF"/>
  <path d="M -32 2 L -10 26 L 34 -24" fill="none" stroke="#FF6B1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="120" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2" fill="#FFFFFF">TRAITÉ</text>
</g>

<!-- residue / rest-waves : ondulations discretes autour, plein cadre -->
<g id="res-residue" opacity="0.4">
  <circle cx="960" cy="540" r="340" fill="none" stroke="#FF6B1A" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="960" cy="540" r="420" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>
</g>
<g id="res-rest-waves" fill="none" stroke="#FFFFFF" filter="url(#r-glowOSoft)" opacity="0.5">
  <circle cx="960" cy="540" r="480" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="960" cy="540" r="540" stroke-width="1" stroke-opacity="0.05"/>
</g>

<rect x="0" y="0" width="1920" height="1080" fill="url(#r-bgSeal)" opacity="0.08" style="mix-blend-mode:overlay"/>
</svg>
