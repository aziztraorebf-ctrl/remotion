  <circle cx="530" cy="565" r="210" fill="url(#impactGlow)"/>
  <circle cx="530" cy="565" r="80" fill="url(#coreGlow)"/>

  <circle cx="610" cy="565" r="96" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="543 60" stroke-linecap="butt" transform="rotate(200 610 565)" filter="url(#ringGlow)"/>
  <circle cx="610" cy="565" r="96" fill="none" stroke="#FF6B1A" stroke-width="5" stroke-dasharray="60 543" stroke-linecap="butt" transform="rotate(200 610 565)"/>

  <circle cx="610" cy="565" r="62" fill="none" stroke="#FF6B1A" stroke-width="2" opacity="0.55"/>

  <circle cx="530" cy="565" r="15" fill="#FF6B1A" filter="url(#packetGlow)"/>
  <circle cx="530" cy="565" r="6" fill="#FFFFFF"/>

  <path d="M 530 565 L 610 565" stroke="#FF6B1A" stroke-width="1.5" opacity="0.35"/>
  <path d="M 530 565 L 558 493" stroke="#FF6B1A" stroke-width="1" opacity="0.2"/>
  <path d="M 530 565 L 558 637" stroke="#FF6B1A" stroke-width="1" opacity="0.2"/>

