  <title id="sceneTitle">Gazoduc interrompu, financement absent et accord non signé</title>
  <desc id="sceneDesc">Un gazoduc massif s'interrompt au-dessus d'un vide. Son prolongement n'existe plus que sous forme de tracé technique doré, tandis qu'une caisse vide et un document sans sceau matérialisent les obstacles financiers et diplomatiques.</desc>

