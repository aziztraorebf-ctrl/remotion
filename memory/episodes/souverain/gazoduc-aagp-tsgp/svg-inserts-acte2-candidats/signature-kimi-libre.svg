      <path d="M1512 780 l30 12 M1545 728 l-38 8 M1570 696 l-40 4 M1593 666 l-38 0 M1616 638 l-34 -4"/>
    </g>
    <path d="M1470 830 L1452 852 L1462 856 L1480 834 Z" fill="#4a4436"/>
