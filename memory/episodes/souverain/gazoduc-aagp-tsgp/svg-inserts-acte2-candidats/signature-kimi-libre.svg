    <path d="M1560 880 L1620 880 L1612 930 L1568 930 Z" fill="none" stroke="#3a5488" stroke-width="2"/>
    <ellipse cx="1590" cy="880" rx="30" ry="8" fill="#0a1226" stroke="#3a5488" stroke-width="2"/>
    <path d="M1570 906 h40" stroke="#2a3f66" stroke-width="1.5"/>
  </g>

  <!-- ===== ÉTOILES / POUSSIÈRE SOLENNELLE ===== -->
  <g id="solemn-motes" fill="#3a5488">
    <circle cx="480" cy="300" r="2.5"/><circle cx="1500" cy="240" r="2"/><circle cx="1620" cy="420" r="2.5"/>
    <circle cx="380" cy="760" r="2"/><circle cx="1720" cy="760" r="2"/><circle cx="280" cy="560" r="2.5"/>
    <circle cx="1660" cy="180" r="2"/><circle cx="520" cy="140" r="2"/>
