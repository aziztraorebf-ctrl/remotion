  </g>

  <!-- ===== SCEAU DE CIRE DORÉ (l'accent unique — l'officialisation) ===== -->
  <g id="golden-seal">
    <circle cx="1234" cy="722" r="62" fill="#FFC742"/>
    <circle cx="1234" cy="722" r="62" fill="none" stroke="#c79a2a" stroke-width="3"/>
    <circle cx="1234" cy="722" r="50" fill="none" stroke="#c79a2a" stroke-width="1.5"/>
    <!-- quinze étoiles gravées sur le pourtour du sceau -->
    <g id="seal-stars" fill="#8a6a12">
      <circle cx="1234" cy="666" r="3"/><circle cx="1262" cy="672" r="3"/><circle cx="1282" cy="690" r="3"/>
      <circle cx="1288" cy="716" r="3"/><circle cx="1280" cy="742" r="3"/><circle cx="1262" cy="762" r="3"/>
      <circle cx="1236" cy="770" r="3"/><circle cx="1208" cy="764" r="3"/><circle cx="1188" cy="746" r="3"/>
      <circle cx="1180" cy="720" r="3"/><circle cx="1186" cy="694" r="3"/><circle cx="1204" cy="676" r="3"/>
      <circle cx="1220" cy="668" r="3"/><circle cx="1248" cy="668" r="3"/><circle cx="1272" cy="680" r="3"/>
    </g>
    <!-- emblème central du sceau : flamme de gaz stylisée -->
