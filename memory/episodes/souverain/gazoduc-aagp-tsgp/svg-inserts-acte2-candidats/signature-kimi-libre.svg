  <g id="quill">
    <path d="M1470 830 Q1560 660 1700 560 Q1600 640 1540 780 Q1510 830 1470 830 Z" fill="#e8e4d8"/>
    <path d="M1470 830 Q1560 660 1700 560" fill="none" stroke="#b9b2a0" stroke-width="2"/>
    <path d="M1485 815 Q1565 665 1685 575" fill="none" stroke="#8f887a" stroke-width="2.5"/>
    <g id="quill-barbs" stroke="#b9b2a0" stroke-width="1.2" fill="none">
