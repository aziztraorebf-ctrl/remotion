<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- ===== FOND ===== -->
  <g id="background">
    <rect x="0" y="0" width="1920" height="1080" fill="#182746"/>
    <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#0e1830" stroke-width="40"/>
  </g>

  <!-- ===== CADRE GRAVÉ ORNEMENTAL ===== -->
  <g id="engraved-frame" fill="none" stroke="#3a5488" stroke-width="2">
    <rect x="70" y="70" width="1780" height="940"/>
    <rect x="86" y="86" width="1748" height="908" stroke-width="1"/>
    <!-- coins -->
    <g id="frame-corners" stroke="#3a5488" stroke-width="2">
      <path d="M70 130 L70 70 L130 70 M96 140 L96 96 L140 96"/>
      <path d="M1850 130 L1850 70 L1790 70 M1824 140 L1824 96 L1780 96"/>
      <path d="M70 950 L70 1010 L130 1010 M96 940 L96 984 L140 984"/>
      <path d="M1850 950 L1850 1010 L1790 1010 M1824 940 L1824 984 L1780 984"/>
    </g>
  </g>

  <!-- ===== FANTÔME DE CÔTE OUEST-AFRICAINE (gravure de fond, très discret) ===== -->
  <g id="ghost-coastline" fill="none" stroke="#2a3f66" stroke-width="2" opacity="0.55">
    <path d="M240 420 Q260 380 300 370 Q340 360 360 385 Q375 410 360 440 Q345 470 355 500 Q365 535 395 555 Q425 575 430 610 Q435 650 410 680 Q390 705 395 735"/>
    <path d="M300 372 Q305 400 295 425 M340 445 Q330 470 340 495 M380 560 Q370 590 385 615" stroke-width="1"/>
    <!-- hachures de mer -->
    <g id="sea-hatching" stroke-width="1" opacity="0.6">
      <path d="M150 460 l30 -18 M160 500 l30 -18 M150 540 l30 -18 M170 580 l30 -18 M160 620 l30 -18 M180 660 l30 -18"/>
      <path d="M450 640 l30 -18 M470 680 l30 -18 M460 720 l30 -18"/>
    </g>
  </g>

  <!-- ===== LIGNE DE PIPELINE FANTÔME (le rêve, pas encore réel) ===== -->
  <g id="ghost-pipeline" fill="none" stroke="#3a5488" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.8">
    <path d="M360 385 Q420 480 400 560 Q385 640 420 700 Q450 750 520 780"/>
  </g>

  <!-- ===== TABLE / SOCLE SOUS LE DOCUMENT ===== -->
  <g id="document-shadow">
    <path d="M560 860 L1420 860 L1460 900 L520 900 Z" fill="#0e1830" opacity="0.7"/>
  </g>

  <!-- ===== LE TRAITÉ (parchemin central) ===== -->
  <g id="treaty-document">
    <path d="M600 200 L1380 200 L1380 860 L600 860 Z" fill="#e8e4d8"/>
    <path d="M600 200 L1380 200 L1380 860 L600 860 Z" fill="none" stroke="#b9b2a0" stroke-width="3"/>
    <!-- bord roulé haut -->
    <path d="M600 200 Q600 176 628 176 L1352 176 Q1380 176 1380 200 Z" fill="#d6d0c0"/>
    <path d="M600 200 Q600 176 628 176 L1352 176 Q1380 176 1380 200" fill="none" stroke="#b9b2a0" stroke-width="2"/>
    <!-- double filet intérieur -->
    <rect x="626" y="222" width="728" height="612" fill="none" stroke="#a89f88" stroke-width="1.5"/>
    <rect x="634" y="230" width="712" height="596" fill="none" stroke="#a89f88" stroke-width="0.75"/>
  </g>

  <!-- ===== EN-TÊTE DU TRAITÉ (fleuron gravé, sans texte) ===== -->
  <g id="document-header" stroke="#4a4436" fill="none">
    <path d="M860 268 Q900 240 940 268 Q980 240 1020 268 Q1060 240 1100 268" stroke-width="2.5"/>
    <circle cx="980" cy="254" r="6" fill="#4a4436" stroke="none"/>
