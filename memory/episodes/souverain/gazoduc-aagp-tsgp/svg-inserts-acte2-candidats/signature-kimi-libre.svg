    <g id="signature-05"><path d="M680 470 q18 -18 24 4 q4 16 24 -12 q10 -10 16 6"/><path d="M676 486 h84" stroke-width="1"/></g>
    <g id="signature-06"><path d="M830 472 q12 -22 26 0 q10 14 24 -10 q8 -10 16 4"/><path d="M826 486 h84" stroke-width="1"/></g>
    <g id="signature-07"><path d="M980 470 q14 -24 24 -2 q8 18 26 -8 q8 -12 16 4"/><path d="M976 486 h84" stroke-width="1"/></g>
    <g id="signature-08"><path d="M1130 472 q16 -20 24 2 q8 14 22 -10 q10 -12 18 6"/><path d="M1126 486 h84" stroke-width="1"/></g>
    <g id="signature-09"><path d="M680 540 q12 -24 26 -2 q10 16 24 -8 q8 -12 18 4"/><path d="M676 556 h84" stroke-width="1"/></g>
    <g id="signature-10"><path d="M830 542 q16 -20 24 2 q6 16 24 -10 q10 -12 16 6"/><path d="M826 556 h84" stroke-width="1"/></g>
    <g id="signature-11"><path d="M980 540 q14 -22 26 0 q8 14 22 -6 q10 -14 20 2"/><path d="M976 556 h84" stroke-width="1"/></g>
    <g id="signature-12"><path d="M1130 542 q10 -26 24 -4 q12 18 26 -8 q8 -12 18 4"/><path d="M1126 556 h84" stroke-width="1"/></g>
    <g id="signature-13"><path d="M755 612 q16 -20 24 2 q6 16 24 -10 q12 -14 18 6"/><path d="M751 628 h84" stroke-width="1"/></g>
    <g id="signature-14"><path d="M905 610 q12 -24 26 -2 q10 16 24 -8 q10 -12 18 4"/><path d="M901 626 h84" stroke-width="1"/></g>
    <g id="signature-15"><path d="M1055 612 q18 -18 24 4 q4 16 24 -12 q10 -10 16 6"/><path d="M1051 628 h84" stroke-width="1"/></g>
  </g>

  <!-- ===== RUBANS DU SCEAU ===== -->
  <g id="seal-ribbons">
    <path d="M1210 760 L1160 850 L1196 838 L1216 872 L1240 792 Z" fill="#8a1f2d"/>
    <path d="M1258 760 L1308 850 L1272 838 L1252 872 L1228 792 Z" fill="#a32838"/>
