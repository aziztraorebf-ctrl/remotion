<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

  <!-- ================= DECOR (fond + bureau, encre pale) ================= -->
  <g id="decor">
    <rect x="0" y="0" width="1920" height="1080" fill="#182746"/>
    <!-- mur / fond, variation discrete -->
    <rect x="0" y="0" width="1920" height="618" fill="#2a3f66" opacity="0.13"/>
    <line x1="0" y1="618" x2="1920" y2="618" stroke="#3a5488" stroke-width="2" opacity="0.55"/>
    <!-- plateau du bureau en perspective -->
    <polygon points="150,618 1770,618 1920,1080 0,1080" fill="#1d2c50" opacity="0.9"/>
    <line x1="150" y1="618" x2="0" y2="1080" stroke="#3a5488" stroke-width="2" opacity="0.35"/>
    <line x1="1770" y1="618" x2="1920" y2="1080" stroke="#3a5488" stroke-width="2" opacity="0.35"/>
    <!-- hachures gravure coin gauche du plateau -->
    <g stroke="#8fa3c7" stroke-width="1.5" opacity="0.10">
      <line x1="120" y1="980" x2="300" y2="880"/>
      <line x1="160" y1="1010" x2="360" y2="900"/>
      <line x1="200" y1="1040" x2="420" y2="920"/>
      <line x1="240" y1="1070" x2="480" y2="940"/>
    </g>
    <!-- hachures gravure coin droit -->
    <g stroke="#8fa3c7" stroke-width="1.5" opacity="0.10">
      <line x1="1800" y1="980" x2="1620" y2="880"/>
      <line x1="1760" y1="1010" x2="1560" y2="900"/>
      <line x1="1720" y1="1040" x2="1500" y2="920"/>
    </g>
    <!-- plume posee a gauche du document -->
    <g id="plume" stroke="#9db1d6" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M 470,830 Q 560,770 640,792"/>
      <path d="M 470,830 Q 545,790 610,782 Q 560,806 500,826 Z" fill="#22345c" fill-opacity="0.5"/>
      <line x1="640" y1="792" x2="662" y2="800"/>
    </g>
    <!-- encrier -->
    <g id="encrier" stroke="#9db1d6" stroke-width="2.5" fill="#20315a" opacity="0.45">
      <path d="M 372,838 L 366,878 Q 400,892 434,878 L 428,838 Z"/>
      <ellipse cx="400" cy="838" rx="28" ry="8" fill="#141f3a"/>
    </g>
  </g>

  <!-- ================= RAPPEL 2016 (medaillon symbolique, second plan) ================= -->
  <g id="rappel_2016" opacity="0.32">
    <!-- medaillon grave -->
    <circle cx="330" cy="268" r="152" fill="none" stroke="#8fa3c7" stroke-width="2.5"/>
    <circle cx="330" cy="268" r="140" fill="none" stroke="#8fa3c7" stroke-width="1" opacity="0.6"/>
    <!-- deux manches + poignee de main stylisee (aucun visage) -->
    <g stroke="#9db1d6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 208,232 L 282,258 L 284,286 L 206,268 Z" fill="#22345c" fill-opacity="0.35"/>
      <path d="M 452,232 L 378,258 L 376,286 L 454,268 Z" fill="#22345c" fill-opacity="0.35"/>
      <path d="M 282,258 Q 306,246 330,258 Q 354,246 378,258 L 376,286 Q 352,296 330,286 Q 308,296 284,286 Z" fill="#2a3f66" fill-opacity="0.4"/>
      <line x1="308" y1="264" x2="308" y2="284"/>
      <line x1="330" y1="262" x2="330" y2="286"/>
      <line x1="352" y1="264" x2="352" y2="284"/>
    </g>
    <!-- premiere pierre posee sous la poignee de main -->
    <g stroke="#9db1d6" stroke-width="2.5" fill="#22345c" fill-opacity="0.4" stroke-linejoin="round">
      <polygon points="296,332 364,332 374,364 286,364"/>
      <line x1="330" y1="332" x2="330" y2="364" opacity="0.6"/>
    </g>
    <!-- eclats discrets autour de la pierre -->
    <g stroke="#9db1d6" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="268" y1="322" x2="254" y2="312"/>
      <line x1="392" y1="322" x2="406" y2="312"/>
      <line x1="330" y1="312" x2="330" y2="298"/>
    </g>
    <!-- fil du temps : pointille du medaillon vers le document (2016 -> 2026) -->
    <path id="fil_temps" d="M 452,340 Q 640,470 820,560" fill="none" stroke="#8fa3c7" stroke-width="2.5" stroke-dasharray="4 14" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ================= DOCUMENT (parchemin a plat, centre) ================= -->
  <g id="document">
    <!-- ombre portee -->
    <polygon points="775,600 1325,600 1392,898 712,898" fill="#0f1a33" opacity="0.55"/>
    <!-- feuille en perspective -->
    <polygon points="760,585 1310,585 1370,880 700,880" fill="#223760" stroke="#b9c8e4" stroke-width="3" stroke-linejoin="round"/>
    <!-- marge interieure gravee -->
    <polygon points="788,610 1284,610 1336,856 736,856" fill="none" stroke="#8fa3c7" stroke-width="1.5" opacity="0.4"/>
    <!-- lignes de texte abstraites (aucun texte reel) -->
    <g stroke="#9db1d6" stroke-width="4" stroke-linecap="round" opacity="0.5">
      <line x1="816" y1="642" x2="1266" y2="642"/>
      <line x1="812" y1="668" x2="1272" y2="668"/>
      <line x1="808" y1="694" x2="1180" y2="694"/>
      <line x1="804" y1="720" x2="1000" y2="720"/>
      <line x1="800" y1="746" x2="996" y2="746"/>
      <line x1="796" y1="772" x2="990" y2="772"/>
    </g>
    <!-- paraphe abstrait en bas a gauche -->
    <path id="paraphe" d="M 792,828 q 22,-20 38,-2 t 42,-8 t 38,6" fill="none" stroke="#b9c8e4" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="784" y1="842" x2="960" y2="842" stroke="#8fa3c7" stroke-width="2" opacity="0.4"/>
    <!-- emplacement du sceau (pointille pale, avant impact) -->
    <ellipse id="cible_sceau" cx="1150" cy="765" rx="88" ry="34" fill="none" stroke="#8fa3c7" stroke-width="2" stroke-dasharray="6 10" opacity="0.4"/>
  </g>

  <!-- ================= EMPREINTE DU SCEAU (revele a l'impact — seule vraie couleur) ================= -->
  <g id="empreinte_sceau">
    <ellipse cx="1150" cy="765" rx="86" ry="33" fill="none" stroke="#FFC742" stroke-width="5"/>
    <ellipse cx="1150" cy="765" rx="62" ry="23" fill="none" stroke="#FFC742" stroke-width="2.5" opacity="0.85"/>
    <!-- crans entre les deux anneaux -->
    <g stroke="#FFC742" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="1150" y1="732" x2="1150" y2="742"/>
      <line x1="1150" y1="788" x2="1150" y2="798"/>
      <line x1="1064" y1="765" x2="1088" y2="765"/>
      <line x1="1212" y1="765" x2="1236" y2="765"/>
      <line x1="1092" y1="742" x2="1108" y2="749"/>
      <line x1="1208" y1="742" x2="1192" y2="749"/>
      <line x1="1092" y1="788" x2="1108" y2="781"/>
      <line x1="1208" y1="788" x2="1192" y2="781"/>
    </g>
    <!-- etoile centrale (rose des vents epuree) -->
    <g stroke="#FFC742" stroke-width="2.5" stroke-linecap="round">
      <line x1="1150" y1="752" x2="1150" y2="778"/>
      <line x1="1118" y1="765" x2="1182" y2="765"/>
      <circle cx="1150" cy="765" r="4" fill="#FFC742" stroke="none"/>
    </g>
  </g>

  <!-- ================= HALO DU SCEAU (climax, cercles concentriques, zero blur) ================= -->
  <g id="halo_sceau">
    <ellipse cx="1150" cy="765" rx="100" ry="38" fill="#FFC742" opacity="0.10"/>
    <ellipse cx="1150" cy="765" rx="112" ry="43" fill="none" stroke="#FFC742" stroke-width="3" opacity="0.45"/>
    <ellipse cx="1150" cy="765" rx="152" ry="58" fill="none" stroke="#FFC742" stroke-width="2.5" opacity="0.28"/>
    <ellipse cx="1150" cy="765" rx="196" ry="75" fill="none" stroke="#FFC742" stroke-width="2" opacity="0.16"/>
    <ellipse cx="1150" cy="765" rx="246" ry="94" fill="none" stroke="#FFC742" stroke-width="1.5" opacity="0.08"/>
    <!-- rayons courts a l'impact -->
    <g stroke="#FFC742" stroke-width="3" stroke-linecap="round" opacity="0.35">
      <line x1="1150" y1="712" x2="1150" y2="694"/>
      <line x1="1256" y1="738" x2="1276" y2="730"/>
      <line x1="1044" y1="738" x2="1024" y2="730"/>
      <line x1="1256" y1="792" x2="1276" y2="800"/>
      <line x1="1044" y1="792" x2="1024" y2="800"/>
      <line x1="1150" y1="818" x2="1150" y2="836"/>
    </g>
  </g>

  <!-- ================= TAMPON (suspendu au-dessus, pret a tomber) ================= -->
  <g id="tampon">
    <!-- pommeau -->
    <path d="M 1108,272 A 42,42 0 0 1 1192,272 Z" fill="#2a3f66" stroke="#b9c8e4" stroke-width="3"/>
    <path d="M 1120,258 A 30,26 0 0 1 1150,236" fill="none" stroke="#8fa3c7" stroke-width="1.5" opacity="0.5"/>
    <!-- collerette sous le pommeau -->
    <rect x="1122" y="272" width="56" height="10" rx="4" fill="#22345c" stroke="#b9c8e4" stroke-width="2.5"/>
    <!-- fut -->
    <rect x="1132" y="282" width="36" height="80" rx="8" fill="#2a3f66" stroke="#b9c8e4" stroke-width="3"/>
    <g stroke="#8fa3c7" stroke-width="1.5" opacity="0.35">
      <line x1="1140" y1="290" x2="1140" y2="354"/>
      <line x1="1160" y1="290" x2="1160" y2="354"/>
    </g>
    <!-- evasement vers la semelle -->
    <path d="M 1132,362 Q 1128,392 1062,404 L 1238,404 Q 1172,392 1168,362 Z" fill="#22345c" stroke="#b9c8e4" stroke-width="3" stroke-linejoin="round"/>
    <!-- semelle -->
    <rect x="1056" y="404" width="188" height="26" rx="11" fill="#2a3f66" stroke="#b9c8e4" stroke-width="3"/>
    <!-- face inferieure : anneau dore du sceau (visible en amorce) -->
    <ellipse cx="1150" cy="433" rx="90" ry="18" fill="#141f3a" stroke="#b9c8e4" stroke-width="2.5"/>
    <ellipse cx="1150" cy="433" rx="70" ry="13" fill="none" stroke="#FFC742" stroke-width="4"/>
    <ellipse cx="1150" cy="433" rx="46" ry="8" fill="none" stroke="#FFC742" stroke-width="2" opacity="0.8"/>
  </g>

</svg>
