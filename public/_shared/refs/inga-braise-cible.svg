<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <defs>
        <!-- Lueur rouge-brique autour de la turbine -->
        <radialGradient id="redGlow" cx="300" cy="500" r="800" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c04020" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#1a1008" stop-opacity="0"/>
        </radialGradient>
        <!-- Lueur ambiante chaude globale pour relever la luminosité -->
        <radialGradient id="warmAmbient" cx="50%" cy="60%" r="70%">
            <stop offset="0%" stop-color="#6a3a10" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#1a1008" stop-opacity="0"/>
        </radialGradient>
        <!-- Halo village (éteint = zone froide, très légère) -->
        <radialGradient id="villageGlow" cx="1680" cy="660" r="260" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2a1808" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#1a1008" stop-opacity="0"/>
        </radialGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="25"/>
        </filter>
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        
        <g id="insulator">
            <rect x="-4" y="-15" width="8" height="30" fill="#c8a060"/>
            <circle cx="0" cy="-10" r="5" fill="#1a1008" stroke="#c8a060" stroke-width="2"/>
            <circle cx="0" cy="0" r="5" fill="#1a1008" stroke="#c8a060" stroke-width="2"/>
            <circle cx="0" cy="10" r="5" fill="#1a1008" stroke="#c8a060" stroke-width="2"/>
        </g>

        <g id="blade_master">
            <path d="M -15 -40 L -25 -170 A 170 170 0 0 1 25 -170 L 15 -40 Z" fill="#a07838" stroke="#1a1008" stroke-width="3"/>
        </g>
    </defs>

    <!-- FOND ET LUEURS -->
    <rect width="1920" height="1080" fill="#1a1008"/>
    <rect width="1920" height="1080" fill="url(#warmAmbient)"/>
    <rect width="1920" height="1080" fill="url(#redGlow)"/>

    <!-- COUCHES DE TERRAIN -->
    <path d="M0 520 Q 400 470 960 550 T 1920 490 L 1920 1080 L 0 1080 Z" fill="#2a1a08" opacity="0.6"/>
    <path d="M0 600 Q 500 660 1000 580 T 1920 630 L 1920 1080 L 0 1080 Z" fill="#2a1a08" opacity="0.9"/>
    <path d="M0 660 Q 600 620 1200 700 T 1920 670 L 1920 1080 L 0 1080 Z" fill="#2a1a08" opacity="0.8"/>

    <!-- FLEUVE -->
    <path d="M0 700 C 400 720 800 680 1920 750 L 1920 1080 L 0 1080 Z" fill="#0a1828"/>
    <path d="M 150 760 Q 350 780 550 750" stroke="#1a3848" stroke-width="2" fill="none"/>
    <path d="M 700 820 Q 1000 800 1300 850" stroke="#1a3848" stroke-width="2" fill="none"/>
    <path d="M 1400 920 Q 1650 950 1850 900" stroke="#1a3848" stroke-width="2" fill="none"/>
    <path d="M 200 950 Q 450 980 700 940" stroke="#1a3848" stroke-width="2" fill="none"/>
    
    <!-- REFLET TURBINE -->
    <ellipse cx="300" cy="880" rx="160" ry="50" fill="#f2a020" opacity="0.08" filter="url(#blur)"/>

    <!-- BARRAGE ET TURBINE -->
    <rect x="280" y="280" width="40" height="470" fill="#3a2a18"/>

    <g id="turbine_body">
        <ellipse cx="300" cy="600" rx="180" ry="60" fill="#2a1508"/>
        <rect x="120" y="500" width="360" height="100" fill="#3a2010"/>
        
        <path d="M 120 550 A 180 60 0 0 0 480 550" fill="none" stroke="#1a1008" stroke-width="2"/>
        <circle cx="160" cy="565" r="3" fill="#c8a060"/>
        <circle cx="230" cy="595" r="3" fill="#c8a060"/>
        <circle cx="300" cy="610" r="3" fill="#c8a060"/>
        <circle cx="370" cy="595" r="3" fill="#c8a060"/>
        <circle cx="440" cy="565" r="3" fill="#c8a060"/>
    </g>

    <g id="turbine_wheel" transform="translate(300, 500)">
        <circle cx="0" cy="0" r="200" fill="#c8a060" stroke="#1a1008" stroke-width="3"/>
        <circle cx="0" cy="0" r="170" fill="none" stroke="#1a1008" stroke-width="3"/>
        
        <use href="#blade_master" transform="rotate(0)"/>
        <use href="#blade_master" transform="rotate(45)"/>
        <use href="#blade_master" transform="rotate(90)"/>
        <use href="#blade_master" transform="rotate(135)"/>
        <use href="#blade_master" transform="rotate(180)"/>
        <use href="#blade_master" transform="rotate(225)"/>
        <use href="#blade_master" transform="rotate(270)"/>
        <use href="#blade_master" transform="rotate(315)"/>
        
        <circle cx="0" cy="0" r="50" fill="#f2a020" opacity="0.3"/>
        <circle cx="0" cy="0" r="30" fill="#f2a020"/>
        
        <circle cx="0" cy="-185" r="4" fill="#1a1008"/>
        <circle cx="0" cy="185" r="4" fill="#1a1008"/>
        <circle cx="-185" cy="0" r="4" fill="#1a1008"/>
        <circle cx="185" cy="0" r="4" fill="#1a1008"/>
        <circle cx="-130" cy="-130" r="4" fill="#1a1008"/>
        <circle cx="130" cy="130" r="4" fill="#1a1008"/>
        <circle cx="-130" cy="130" r="4" fill="#1a1008"/>
        <circle cx="130" cy="-130" r="4" fill="#1a1008"/>
    </g>

    <!-- ZONE VILLAGE — halo froid très discret -->
    <rect width="1920" height="1080" fill="url(#villageGlow)"/>

    <!-- VILLAGE — maisons doublées de taille, contraste relevé, style africain toit-terrasse -->
    <g id="village">

        <!-- MAISON 1 — grande (avant-plan gauche du groupe) -->
        <g transform="translate(1480, 570)">
            <!-- ombre au sol -->
            <ellipse cx="55" cy="128" rx="70" ry="10" fill="#0a0502" opacity="0.4"/>
            <!-- corps principal -->
            <rect x="0" y="20" width="110" height="90" fill="#4a3020" stroke="#c8a060" stroke-width="1.5"/>
            <!-- toit-terrasse africain (toit plat avec rebord visible) -->
            <rect x="-8" y="6" width="126" height="18" fill="#5a3a20" stroke="#c8a060" stroke-width="1.5"/>
            <!-- rebord supérieur du toit -->
            <rect x="-8" y="0" width="126" height="8" fill="#3a2010"/>
            <!-- texture mur — lignes horizontales -->
            <line x1="4" y1="50" x2="106" y2="50" stroke="#3a2010" stroke-width="1" opacity="0.6"/>
            <line x1="4" y1="75" x2="106" y2="75" stroke="#3a2010" stroke-width="1" opacity="0.6"/>
            <line x1="4" y1="100" x2="106" y2="100" stroke="#3a2010" stroke-width="1" opacity="0.6"/>
            <!-- fenêtre gauche éteinte -->
            <rect x="12" y="40" width="28" height="28" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.8"/>
            <line x1="26" y1="40" x2="26" y2="68" stroke="#1a1008" stroke-width="1"/>
            <line x1="12" y1="54" x2="40" y2="54" stroke="#1a1008" stroke-width="1"/>
            <!-- fenêtre droite éteinte -->
            <rect x="70" y="40" width="28" height="28" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.8"/>
            <line x1="84" y1="40" x2="84" y2="68" stroke="#1a1008" stroke-width="1"/>
            <line x1="70" y1="54" x2="98" y2="54" stroke="#1a1008" stroke-width="1"/>
            <!-- porte centrale -->
            <rect x="42" y="72" width="26" height="38" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.7"/>
        </g>

        <!-- MAISON 2 — moyenne (arrière-plan centre-gauche) -->
        <g transform="translate(1610, 540)">
            <ellipse cx="42" cy="108" rx="52" ry="8" fill="#0a0502" opacity="0.35"/>
            <rect x="0" y="16" width="84" height="76" fill="#422a18" stroke="#c8a060" stroke-width="1.2"/>
            <rect x="-6" y="4" width="96" height="15" fill="#523218" stroke="#c8a060" stroke-width="1.2"/>
            <rect x="-6" y="0" width="96" height="6" fill="#2a1808"/>
            <line x1="4" y1="42" x2="80" y2="42" stroke="#2a1808" stroke-width="1" opacity="0.6"/>
            <line x1="4" y1="65" x2="80" y2="65" stroke="#2a1808" stroke-width="1" opacity="0.6"/>
            <rect x="10" y="32" width="22" height="22" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.7"/>
            <rect x="52" y="32" width="22" height="22" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.7"/>
            <rect x="31" y="60" width="22" height="32" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.7"/>
        </g>

        <!-- MAISON 3 — plus petite (arrière-plan droite) -->
        <g transform="translate(1720, 555)">
            <ellipse cx="38" cy="95" rx="46" ry="7" fill="#0a0502" opacity="0.3"/>
            <rect x="0" y="14" width="76" height="66" fill="#3c2416" stroke="#c8a060" stroke-width="1.2"/>
            <rect x="-5" y="4" width="86" height="13" fill="#4a2e16" stroke="#c8a060" stroke-width="1"/>
            <rect x="-5" y="0" width="86" height="6" fill="#2a1808"/>
            <line x1="4" y1="38" x2="72" y2="38" stroke="#2a1808" stroke-width="1" opacity="0.5"/>
            <line x1="4" y1="58" x2="72" y2="58" stroke="#2a1808" stroke-width="1" opacity="0.5"/>
            <rect x="8" y="28" width="20" height="18" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.7"/>
            <rect x="48" y="28" width="20" height="18" fill="#0d0805" stroke="#c8a060" stroke-width="1" opacity="0.7"/>
            <rect x="28" y="52" width="20" height="28" fill="#0d0805" stroke="#c8a060" stroke-width="0.8" opacity="0.7"/>
        </g>

        <!-- MAISON 4 — petite (fond extrême droite) -->
        <g transform="translate(1820, 565)">
            <ellipse cx="30" cy="82" rx="36" ry="6" fill="#0a0502" opacity="0.25"/>
            <rect x="0" y="12" width="60" height="58" fill="#38210f" stroke="#c8a060" stroke-width="1"/>
            <rect x="-4" y="3" width="68" height="12" fill="#422818" stroke="#c8a060" stroke-width="1"/>
            <rect x="-4" y="0" width="68" height="5" fill="#2a1808"/>
            <line x1="3" y1="34" x2="57" y2="34" stroke="#2a1808" stroke-width="1" opacity="0.5"/>
            <rect x="8" y="22" width="16" height="14" fill="#0d0805" stroke="#c8a060" stroke-width="0.8" opacity="0.7"/>
            <rect x="36" y="22" width="16" height="14" fill="#0d0805" stroke="#c8a060" stroke-width="0.8" opacity="0.7"/>
            <rect x="22" y="44" width="16" height="26" fill="#0d0805" stroke="#c8a060" stroke-width="0.8" opacity="0.6"/>
        </g>

        <!-- Ligne de sol commune — relie le groupe -->
        <path d="M 1470 700 C 1580 690 1700 705 1895 695" fill="none" stroke="#c8a060" stroke-width="1" opacity="0.2"/>
    </g>

    <!-- PYLÔNE -->
    <g id="pylon">
        <rect x="1020" y="750" width="40" height="20" fill="#c8a060"/>
        <rect x="1180" y="750" width="40" height="20" fill="#c8a060"/>
        
        <g stroke="#c8a060" stroke-width="1.5" opacity="0.7">
            <line x1="1040" y1="750" x2="1182" y2="600"/>
            <line x1="1200" y1="750" x2="1058" y2="600"/>
            <line x1="1058" y1="600" x2="1168" y2="480"/>
            <line x1="1182" y1="600" x2="1072" y2="480"/>
            <line x1="1072" y1="480" x2="1154" y2="360"/>
            <line x1="1168" y1="480" x2="1086" y2="360"/>
            <line x1="1086" y1="360" x2="1139" y2="240"/>
            <line x1="1154" y1="360" x2="1101" y2="240"/>
            <line x1="1101" y1="240" x2="1125" y2="120"/>
            <line x1="1139" y1="240" x2="1115" y2="120"/>
        </g>

        <line x1="1058" y1="600" x2="1182" y2="600" stroke="#c8a060" stroke-width="2.5"/>
        <line x1="1072" y1="480" x2="1168" y2="480" stroke="#c8a060" stroke-width="2.5"/>
        <line x1="1086" y1="360" x2="1154" y2="360" stroke="#c8a060" stroke-width="2.5"/>
        <line x1="1101" y1="240" x2="1139" y2="240" stroke="#c8a060" stroke-width="2.5"/>
        <line x1="1115" y1="120" x2="1125" y2="120" stroke="#c8a060" stroke-width="2.5"/>

        <line x1="1040" y1="750" x2="1120" y2="80" stroke="#c8a060" stroke-width="4"/>
        <line x1="1200" y1="750" x2="1120" y2="80" stroke="#c8a060" stroke-width="4"/>

        <rect x="1100" y="70" width="40" height="10" fill="#c8a060"/>
        
        <line x1="1060" y1="340" x2="1180" y2="340" stroke="#c8a060" stroke-width="4"/>
        <line x1="1086" y1="360" x2="1060" y2="340" stroke="#c8a060" stroke-width="2"/>
        <line x1="1154" y1="360" x2="1180" y2="340" stroke="#c8a060" stroke-width="2"/>
    </g>

    <!-- CÂBLE ÉLECTRIQUE (HÉROS) -->
    <path d="M 480 490 C 750 320 980 280 1120 340 C 1360 420 1600 500 1920 540" stroke="#f2a020" stroke-width="18" fill="none" opacity="0.12"/>
    <path d="M 480 490 C 750 320 980 280 1120 340 C 1360 420 1600 500 1920 540" stroke="#f2a020" stroke-width="6" fill="none"/>

    <!-- ISOLATEURS -->
    <use href="#insulator" x="650" y="385" transform="rotate(-20, 650, 385)"/>
    <use href="#insulator" x="900" y="295" transform="rotate(5, 900, 295)"/>
    <use href="#insulator" x="1120" y="340" transform="rotate(15, 1120, 340)"/>
    <use href="#insulator" x="1400" y="440" transform="rotate(20, 1400, 440)"/>
    <use href="#insulator" x="1700" y="515" transform="rotate(10, 1700, 515)"/>
</svg>