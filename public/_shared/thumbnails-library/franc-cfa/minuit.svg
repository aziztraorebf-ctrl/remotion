<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Halo dore : eclaire localement le fond bleu nuit (survie en plein soleil) -->
    <radialGradient id="halo" cx="620" cy="520" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#C9A227" stop-opacity="0.44"/>
      <stop offset="0.76" stop-color="#C9A227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <!-- La moitie qui tombe sort de la lumiere : elle s'assombrit en chutant -->
    <linearGradient id="chute" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#DED8C9"/>
      <stop offset="0.5" stop-color="#A79F8C"/>
      <stop offset="1" stop-color="#5E5A4E"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#182746"/>
  <circle cx="620" cy="520" r="720" fill="url(#halo)"/>

  <!-- ==================== HORLOGE (arriere-plan) ==================== -->
  <circle cx="620" cy="520" r="386" fill="#1E3055" stroke="#F4F1EA" stroke-width="16"/>
  <circle cx="620" cy="520" r="352" fill="none" stroke="#F4F1EA" stroke-width="3" opacity="0.45"/>

  <!-- Index des heures -->
  <g stroke="#F4F1EA" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="620" y1="152" x2="620" y2="184"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(30 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(60 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(90 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(120 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(150 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(180 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(210 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(240 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(270 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(300 620 520)"/>
    <line x1="620" y1="152" x2="620" y2="184" transform="rotate(330 620 520)"/>
  </g>

  <!-- Chiffres : seul le 12 est en or plein (c'est l'heure qui compte), les autres en retrait -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle" fill="#C9A227">
    <text x="620" y="252" font-size="80" dy="0.35em">12</text>
    <g font-size="52" opacity="0.5">
      <text x="773" y="279" dy="0.35em">1</text>
      <text x="885" y="391" dy="0.35em">2</text>
      <text x="926" y="520" dy="0.35em">3</text>
      <text x="885" y="649" dy="0.35em">4</text>
      <text x="773" y="761" dy="0.35em">5</text>
      <text x="620" y="802" dy="0.35em">6</text>
      <text x="467" y="761" dy="0.35em">7</text>
      <text x="355" y="649" dy="0.35em">8</text>
      <text x="314" y="520" dy="0.35em">9</text>
      <text x="355" y="391" dy="0.35em">10</text>
      <text x="467" y="279" dy="0.35em">11</text>
    </g>
  </g>

  <!-- Aiguilles : les deux droit sur le 12 = minuit. Remontees au-dessus du billet
       pour rester VISIBLES en vignette (le billet occupe la moitie basse du cadran). -->
  <!-- MINUIT PILE : les deux aiguilles se superposent, on ne voit qu'une seule forme
       droite sur le 12. Pas de fragment casse (il lisait comme une 2e aiguille sur le 1). -->
  <polygon fill="#F4F1EA" points="602,404 602,312 620,278 638,312 638,404"/>

  <!-- Axe des aiguilles, visible juste au-dessus du billet -->
  <circle cx="620" cy="404" r="20" fill="#F4F1EA"/>
  <circle cx="620" cy="404" r="8" fill="#182746"/>

  <!-- ==================== LE BILLET DECHIRE (sujet principal, devant) ==================== -->
  <!-- Moitie GAUCHE : intacte, dans la lumiere -->
  <g>
    <path fill="#F4F1EA" d="M300,430 H612 L634,478 L600,522 L638,568 L596,614 L630,660 L608,700 L618,732 H300 Z"/>
    <polyline fill="none" stroke="#C9A227" stroke-width="13" stroke-linejoin="round"
      points="612,430 634,478 600,522 638,568 596,614 630,660 608,700 618,732"/>
    <g stroke="#182746" fill="none">
      <path stroke-width="5" d="M330,458 H580 M330,704 H580 M330,458 V704"/>
      <circle cx="430" cy="580" r="72" stroke-width="6"/>
      <circle cx="430" cy="580" r="34" stroke-width="5"/>
      <path stroke-width="4" opacity="0.55" d="M330,500 H560 M330,530 H560 M330,630 H540 M330,660 H540"/>
    </g>
    <text x="348" y="500" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="42" fill="#182746">10 000</text>
  </g>

  <!-- Moitie DROITE : elle TOMBE — decalee vers le bas, fortement inclinee, et elle s'assombrit -->
  <g transform="translate(78,104) rotate(11 660 600)">
    <path fill="url(#chute)" d="M940,430 V732 H618 L608,700 L630,660 L596,614 L638,568 L600,522 L634,478 L612,430 Z"/>
    <polyline fill="none" stroke="#C9A227" stroke-width="13" stroke-linejoin="round"
      points="612,430 634,478 600,522 638,568 596,614 630,660 608,700 618,732"/>
    <g stroke="#182746" fill="none" opacity="0.8">
      <path stroke-width="5" d="M660,458 H912 M660,704 H912 M912,458 V704"/>
      <path stroke-width="4" opacity="0.5" d="M700,660 H880"/>
    </g>
    <text x="790" y="600" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="88" fill="#182746" text-anchor="middle" opacity="0.85">10 000</text>
  </g>

  <!-- ==================== TEXTE ====================
       L'image MONTRE deja minuit et la dechirure. Le texte nomme ce qui n'est pas
       montrable : QUELLE monnaie, et l'AMPLEUR du choc. Bloc centre verticalement
       dans la colonne droite laissee libre par l'horloge. -->
  <g text-anchor="middle">
    <!-- Surtitre : le sujet, cherchable -->
    <text x="1500" y="386" font-family="Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="62" letter-spacing="12" fill="#C9A227">FRANC CFA</text>
    <!-- Filet de separation -->
    <line x1="1290" y1="434" x2="1710" y2="434" stroke="#C9A227" stroke-width="4" opacity="0.7"/>
    <!-- L'ampleur du choc : ce que l'image ne peut pas dire -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#F4F1EA">
      <text x="1500" y="566" font-size="96">Divisé par deux</text>
      <text x="1500" y="678" font-size="96">en une nuit</text>
    </g>
  </g>
</svg>
