      <stop offset="0.6" stop-color="#070d1a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#03060c" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="node-core-cyan" cx="0.5" cy="0.5" r="0.5">
