  <defs>
    <style>
      .bg { fill: #F1EBE0; }
      .pale_fill { fill: #F1EBE0; stroke: #9E9385; stroke-width: 3; stroke-linejoin: round; }
      .pale_stroke { fill: none; stroke: #9E9385; stroke-width: 2; stroke-linecap: round; }
      .pale_shadow { fill: #E4DCD0; stroke: none; }
      .solid_fill { fill: #755035; stroke: #2F2116; stroke-width: 3; stroke-linejoin: round; }
      .solid_stroke { fill: none; stroke: #2F2116; stroke-width: 2; stroke-linecap: round; }
