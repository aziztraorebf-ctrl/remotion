<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <clipPath id="ukClip"><rect width="60" height="40"/></clipPath>
  <g clip-path="url(#ukClip)">
    <rect width="60" height="40" fill="#012169"/>
    <!-- white diagonals -->
    <path d="M0,0 L60,40 M60,0 L0,40" stroke="#FFFFFF" stroke-width="8"/>
    <!-- red diagonals (counterchanged, approximated centered) -->
    <path d="M0,0 L60,40" stroke="#C8102E" stroke-width="4"/>
    <path d="M60,0 L0,40" stroke="#C8102E" stroke-width="4"/>
    <!-- white cross -->
    <rect x="25" width="10" height="40" fill="#FFFFFF"/>
    <rect y="15" width="60" height="10" fill="#FFFFFF"/>
    <!-- red cross -->
    <rect x="27" width="6" height="40" fill="#C8102E"/>
    <rect y="17" width="60" height="6" fill="#C8102E"/>
  </g>
</svg>
